<!DOCTYPE html>
<html>
<head>
    <title>Apple Cells: Legend of Yakup</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser-arcade-physics.min.js"></script>
    <style>
        body { margin: 0; background: #2c3e50; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
    </style>
</head>
<body>
<script>
class MainMenu extends Phaser.Scene {
    constructor() { super('MainMenu'); }
    create() {
        this.add.text(400, 80, 'APPLE CELLS', { fontSize: '50px', fill: '#f1c40f', fontStyle: 'bold' }).setOrigin(0.5);
        this.add.text(400, 130, 'Seviye Seç ve Başla', { fontSize: '20px', fill: '#fff' }).setOrigin(0.5);
        for(let i = 1; i <= 10; i++) {
            let x = 150 + ((i-1) % 5) * 125;
            let y = 220 + (Math.floor((i-1) / 5)) * 100;
            let btn = this.add.rectangle(x, y, 90, 60, 0x27ae60).setInteractive();
            this.add.text(x, y, 'Lvl ' + i, { fontSize: '22px', fill: '#fff' }).setOrigin(0.5);
            btn.on('pointerdown', () => this.scene.start('PlayGame', { level: i }));
        }
    }
}

class PlayGame extends Phaser.Scene {
    constructor() { super('PlayGame'); }
    init(data) { this.level = data.level; this.score = 0; this.isAttacking = false; }

    preload() {
        this.load.image('sky', 'https://labs.phaser.io/assets/skies/sky1.png');
        this.load.image('ground', 'https://labs.phaser.io/assets/sprites/platform.png');
        this.load.image('apple', 'https://labs.phaser.io/assets/sprites/apple.png');
        this.load.image('boss', 'https://labs.phaser.io/assets/sprites/slime.png');
        this.load.spritesheet('hero', 'https://labs.phaser.io/assets/sprites/dude.png', { frameWidth: 32, frameHeight: 48 });
    }

    create() {
        // DÜNYA SINIRLARINI GENİŞLETTİM (Karakter takılmasın diye)
        this.physics.world.setBounds(0, 0, 5000, 600);
        this.add.image(0, 0, 'sky').setOrigin(0).setScale(4);

        let platforms = this.physics.add.staticGroup();
        for(let i = 0; i < 15; i++) {
            platforms.create(i * 400, 560, 'ground').setScale(2).setTint(0x2d3436).refreshBody();
        }
        platforms.create(600, 400, 'ground').setTint(0xe17055);
        platforms.create(1200, 300, 'ground').setTint(0xe17055);

        this.player = this.physics.add.sprite(100, 450, 'hero');
        this.player.setCollideWorldBounds(true).setTint(0x0984e3); // Mavi Şövalye
        
        // Kamera Ayarı
        this.cameras.main.setBounds(0, 0, 5000, 600);
        this.cameras.main.startFollow(this.player, true, 0.1, 0.1);

        // Kılıç Efekti (Görsel Saldırı)
        this.sword = this.add.rectangle(0, 0, 70, 10, 0xffffff, 0.9).setVisible(false);

        this.apples = this.physics.add.group({ key: 'apple', repeat: 20, setXY: { x: 400, y: 0, stepX: 200 } });
        this.enemies = this.physics.add.group();
        
        // BOSS
        let boss = this.enemies.create(800 + (this.level * 300), 500, 'boss');
        boss.setScale(1.5 + (this.level * 0.4)).setTint(0xd63031);
        boss.hp = 3 + this.level;

        this.physics.add.collider(this.player, platforms);
        this.physics.add.collider(this.enemies, platforms);
        this.physics.add.collider(this.apples, platforms);
        this.physics.add.overlap(this.player, this.apples, (p, a) => { a.destroy(); this.score += 10; }, null, this);
        this.physics.add.overlap(this.player, this.enemies, this.handleCombat, null, this);

        this.cursors = this.input.keyboard.createCursorKeys();
        this.space = this.input.keyboard.addKey('SPACE');
        this.shift = this.input.keyboard.addKey('SHIFT');

        this.ui = this.add.text(20, 20, '', { fontSize: '24px', fill: '#fff' }).setScrollFactor(0);
    }

    update() {
        let speed = this.shift.isDown ? 600 : 300; // Dead Cells Dash
        if (this.cursors.left.isDown) { this.player.setVelocityX(-speed); this.player.flipX = true; }
        else if (this.cursors.right.isDown) { this.player.setVelocityX(speed); this.player.flipX = false; }
        else { this.player.setVelocityX(0); }
        if (this.cursors.up.isDown && this.player.body.touching.down) { this.player.setVelocityY(-650); }

        if (Phaser.Input.Keyboard.JustDown(this.space)) { this.attack(); }
        this.ui.setText('Altın: ' + this.score + ' | Seviye: ' + this.level);
    }

    attack() {
        this.isAttacking = true;
        this.sword.setPosition(this.player.x + (this.player.flipX ? -45 : 45), this.player.y);
        this.sword.setVisible(true);
        this.player.setTint(0xf1c40f);

        this.enemies.children.iterate((enemy) => {
            if (enemy && Phaser.Geom.Intersects.RectangleToRectangle(this.sword.getBounds(), enemy.getBounds())) {
                enemy.hp--;
                enemy.setTint(0xffffff);
                this.time.delayedCall(100, () => enemy.setTint(0xd63031));
                if(enemy.hp <= 0) { enemy.destroy(); alert("Bölüm Sonu Boss'u Yenildi!"); this.scene.start('MainMenu'); }
            }
        });

        this.time.delayedCall(200, () => { this.sword.setVisible(false); this.isAttacking = false; this.player.setTint(0x0984e3); });
    }

    handleCombat(player, enemy) {
        if (this.isAttacking) return;
        alert("Öldün! Toplanan Altın: " + this.score);
        this.scene.start('MainMenu');
    }
}

const config = { type: Phaser.AUTO, width: 800, height: 450, physics: { default: 'arcade', arcade: { gravity: { y: 1400 } } }, scene: [MainMenu, PlayGame] };
const game = new Phaser.Game(config);
</script>
</body>
</html>
