<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Apple Cells: Redemption | Yakup Kara</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser-arcade-physics.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #87CEEB; overflow: hidden; touch-action: none; }
        #ui-layer { position: absolute; top: 10px; left: 10px; color: #fff; font-family: monospace; z-index: 100; background: rgba(0,0,0,0.5); padding: 10px; }
    </style>
</head>
<body>
    <div id="ui-layer">YAKUP OS: AKTİF | CAN: <span id="hp">100</span> | BOSS CANI: <span id="bhp">500</span></div>

<script>
class AppleCellsRedemption extends Phaser.Scene {
    constructor() {
        super('AppleCellsRedemption');
        this.playerHP = 100;
        this.bossHP = 500;
    }

    preload() {
        this.load.image('sky', 'https://labs.phaser.io/assets/skies/gradient24.png');
        this.load.image('platform', 'https://labs.phaser.io/assets/sprites/platform.png');
        this.load.image('boss', 'https://labs.phaser.io/assets/sprites/aqua_ball.png');
        this.load.spritesheet('hero', 'https://labs.phaser.io/assets/sprites/dude.png', { frameWidth: 32, frameHeight: 48 });
    }

    create() {
        this.physics.world.setBounds(0, 0, 15000, 2000);
        this.add.tileSprite(0, 0, 15000, 2000, 'sky').setOrigin(0);

        // PLATFORMLAR (Düzeltilmiş Yükseklik)
        this.platforms = this.physics.add.staticGroup();
        for (let i = 0; i < 15000; i += 400) {
            this.platforms.create(i, 1950, 'platform').setScale(2).refreshBody().setTint(0x444444);
        }
        // Atlanabilir platformlar (Zıplama gücüne göre ayarlandı)
        this.platforms.create(800, 1750, 'platform').refreshBody();
        this.platforms.create(1300, 1600, 'platform').refreshBody();
        this.platforms.create(1800, 1450, 'platform').refreshBody();

        // OYUNCU (Yakup)
        this.player = this.physics.add.sprite(200, 1800, 'hero').setScale(2.5).setDepth(5);
        this.player.setCollideWorldBounds(true);
        this.player.body.setGravityY(3500);

        // BOSS (Gerçek ve Orada)
        this.boss = this.physics.add.sprite(14500, 1800, 'boss').setScale(10).setTint(0xff0000);
        this.boss.setImmovable(true);

        // KONTROLLER
        this.keys = this.input.keyboard.addKeys({
            W: 'W', A: 'A', S: 'S', D: 'D', SPACE: 'SPACE'
        });

        // MOBİL BUTONLAR (KAYBOLMAZ)
        this.createMobileUI();

        // KAMERA
        this.cameras.main.startFollow(this.player, true, 0.1, 0.1);
        this.cameras.main.setBounds(0, 0, 15000, 2000);

        // FİZİK
        this.physics.add.collider(this.player, this.platforms);
        this.physics.add.overlap(this.player, this.boss, this.fightBoss, null, this);
    }

    createMobileUI() {
        const sw = window.innerWidth;
        const sh = window.innerHeight;
        const s = { fontSize: '70px', backgroundColor: '#000', padding: 20 };

        this.btnL = this.add.text(50, sh - 150, '◀', s).setInteractive().setScrollFactor(0).setDepth(200);
        this.btnR = this.add.text(250, sh - 150, '▶', s).setInteractive().setScrollFactor(0).setDepth(200);
        this.btnJ = this.add.text(sw - 400, sh - 150, '▲', s).setInteractive().setScrollFactor(0).setDepth(200); // Zıplama
        this.btnA = this.add.text(sw - 200, sh - 150, '⚔', { ...s, backgroundColor: '#f00' }).setInteractive().setScrollFactor(0).setDepth(200); // Vurma

        this.touch = { L: false, R: false, J: false };
        this.btnL.on('pointerdown', () => this.touch.L = true);
        this.btnL.on('pointerup', () => this.touch.L = false);
        this.btnR.on('pointerdown', () => this.touch.R = true);
        this.btnR.on('pointerup', () => this.touch.R = false);
        this.btnJ.on('pointerdown', () => this.touch.J = true);
        this.btnJ.on('pointerup', () => this.touch.J = false);
        this.btnA.on('pointerdown', () => this.attackAction());
    }

    attackAction() {
        this.player.setTint(0xffff00);
        this.time.delayedCall(100, () => this.player.clearTint());
        if (Phaser.Math.Distance.Between(this.player.x, this.player.y, this.boss.x, this.boss.y) < 500) {
            this.bossHP -= 10;
            document.getElementById('bhp').innerText = this.bossHP;
        }
    }

    update() {
        if (this.keys.A.isDown || this.touch.L) this.player.setVelocityX(-700);
        else if (this.keys.D.isDown || this.touch.R) this.player.setVelocityX(700);
        else this.player.setVelocityX(0);

        if ((this.keys.W.isDown || this.touch.J) && this.player.body.touching.down) {
            this.player.setVelocityY(-1650); // Artırılmış zıplama gücü
        }

        // SPACE = VURMA SİSTEMİ
        if (Phaser.Input.Keyboard.JustDown(this.keys.SPACE)) {
            this.attackAction();
        }
    }
}

const config = {
    type: Phaser.AUTO,
    width: window.innerWidth,
    height: window.innerHeight,
    physics: { default: 'arcade', arcade: { gravity: { y: 3500 } } },
    scene: [AppleCellsRedemption]
};
new Phaser.Game(config);
</script>
</body>
</html>
