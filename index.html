<!DOCTYPE html>
<html>
<head>
    <title>Knight Knight: Apple Cells v3</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser-arcade-physics.min.js"></script>
    <style>
        body { margin: 0; background: #34495e; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        canvas { display: block; margin: 0 auto; border: 5px solid #2ecc71; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

<script>
let player, cursors, platforms, coins, enemies, scoreText, levelText, swordEffect;
let score = 0;
let currentLevel = 1;
let canAttack = true;

const config = {
    type: Phaser.AUTO,
    width: 800,
    height: 450,
    physics: {
        default: 'arcade',
        arcade: { gravity: { y: 1300 }, debug: false }
    },
    scene: { preload: preload, create: create, update: update }
};

const game = new Phaser.Game(config);

function preload() {
    // Apple Knight tarzı canlı grafikler için assetler
    this.load.image('background', 'https://labs.phaser.io/assets/skies/sky4.png');
    this.load.image('block', 'https://labs.phaser.io/assets/sprites/platform.png');
    this.load.image('gold', 'https://labs.phaser.io/assets/sprites/apple.png'); 
    this.load.image('enemy', 'https://labs.phaser.io/assets/sprites/slime.png');
    this.load.spritesheet('hero', 'https://labs.phaser.io/assets/sprites/dude.png', { frameWidth: 32, frameHeight: 48 });
}

function create() {
    // Arka Plan
    this.add.image(400, 300, 'background').setScale(2).setScrollFactor(0);

    // Platformlar (Apple Knight Renkleri)
    platforms = this.physics.add.staticGroup();
    for (let i = 0; i < 10; i++) {
        platforms.create(i * 400, 430, 'block').setScale(2).setTint(0x27ae60).refreshBody();
    }
    // Rastgele havada asılı platformlar
    platforms.create(500, 300, 'block').setTint(0xe67e22);
    platforms.create(900, 200, 'block').setTint(0xe67e22);

    // Oyuncu (Karakter Güzelleştirme)
    player = this.physics.add.sprite(100, 350, 'hero');
    player.setBounce(0.1).setCollideWorldBounds(true).setTint(0xecf0f1);

    // Saldırı Efekti (Kılıç İzi)
    swordEffect = this.add.rectangle(0, 0, 40, 60, 0xffffff, 0.5);
    swordEffect.setVisible(false);

    // Kamera
    this.cameras.main.setBounds(0, 0, 4000, 600);
    this.cameras.main.startFollow(player, true, 0.05, 0.05);

    // Paralar
    coins = this.physics.add.group({
        key: 'gold',
        repeat: 20,
        setXY: { x: 400, y: 0, stepX: 200 }
    });

    // Düşmanlar (Boss ve Slime'lar)
    enemies = this.physics.add.group();
    createEnemies.call(this);

    // UI
    scoreText = this.add.text(20, 20, 'Para: 0', { fontSize: '24px', fill: '#f1c40f', stroke: '#000', strokeThickness: 4 }).setScrollFactor(0);
    levelText = this.add.text(650, 20, 'Seviye: ' + currentLevel, { fontSize: '24px', fill: '#fff', stroke: '#000', strokeThickness: 4 }).setScrollFactor(0);

    // Kontroller
    cursors = this.input.keyboard.createCursorKeys();
    attackKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE);
    dashKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SHIFT);

    // Animasyonlar
    this.anims.create({
        key: 'run',
        frames: this.anims.generateFrameNumbers('hero', { start: 5, end: 8 }),
        frameRate: 15,
        repeat: -1
    });

    // Çarpışmalar
    this.physics.add.collider(player, platforms);
    this.physics.add.collider(enemies, platforms);
    this.physics.add.collider(coins, platforms);
    this.physics.add.overlap(player, coins, (p, c) => { c.destroy(); score += 10; scoreText.setText('Para: ' + score); }, null, this);
    this.physics.add.overlap(player, enemies, handleCombat, null, this);
}

function createEnemies() {
    for (let i = 1; i <= currentLevel; i++) {
        let e = enemies.create(800 * i, 350, 'enemy');
        e.setTint(0xc0392b).setVelocityX(-100).setCollideWorldBounds(true);
        if (i === currentLevel) { // Bölüm Sonu Boss'u
            e.setScale(2.5).setTint(0x000000);
            e.hp = 3;
        }
    }
}

function update() {
    let speed = dashKey.isDown ? 550 : 300; // Dead Cells Dash Hızı

    if (cursors.left.isDown) {
        player.setVelocityX(-speed);
        player.anims.play('run', true);
        player.flipX = true;
    } else if (cursors.right.isDown) {
        player.setVelocityX(speed);
        player.anims.play('run', true);
        player.flipX = false;
    } else {
        player.setVelocityX(0);
        player.anims.stop();
    }

    if (cursors.up.isDown && player.body.touching.down) {
        player.setVelocityY(-650);
    }

    // SALDIRI SİSTEMİ (Vurduğunu hissetme)
    if (Phaser.Input.Keyboard.JustDown(attackKey) && canAttack) {
        attack();
    }
}

function attack() {
    canAttack = false;
    swordEffect.setPosition(player.x + (player.flipX ? -30 : 30), player.y);
    swordEffect.setVisible(true);
    player.setTint(0xf1c40f); // Saldırı anında sarı parlama

    game.loop.scene.time.delayedCall(150, () => {
        swordEffect.setVisible(false);
        player.setTint(0xecf0f1);
        canAttack = true;
    });
}

function handleCombat(player, enemy) {
    if (!canAttack) { // Eğer o an saldırıyorsak düşman ölsün
        enemy.destroy();
        score += 100;
        scoreText.setText('Para: ' + score);
        if (enemies.countActive() === 0) {
            alert("Seviye Temizlendi! Sıradaki Seviyeye Hazırlan...");
            currentLevel++;
            location.reload(); // Şimdilik basitleştirmek için reload
        }
    } else { // Saldırmıyorsak biz hasar alalım
        player.setTint(0xff0000);
        this.physics.pause();
        alert("Öldün! Topladığın Para: " + score);
        location.reload();
    }
}
</script>
</body>
</html>
