<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple Cells: Terraria Pro Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser-arcade-physics.min.js"></script>
    <style>
        body { margin: 0; background: #0b0d10; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        #game-container { display: flex; justify-content: center; align-items: center; height: 100vh; }
        canvas { border: 4px solid #4a3052; box-shadow: 0 0 40px rgba(0,0,0,0.7); image-rendering: pixelated; }
    </style>
</head>
<body>
    <div id="game-container"></div>

<script>
/**
 * OYUN MOTORU AYARLARI VE GLOBAL DEĞİŞKENLER
 */
const GAME_WIDTH = 800;
const GAME_HEIGHT = 450;
const WORLD_WIDTH = 8000; // Çok uzun Terraria dünyası

class BootScene extends Phaser.Scene {
    constructor() { super('BootScene'); }
    preload() {
        // Profesyonel Yükleme Ekranı
        let progress = this.add.graphics();
        this.load.on('progress', (v) => {
            progress.clear();
            progress.fillStyle(0x2ecc71, 1);
            progress.fillRect(200, 220, 400 * v, 15);
        });

        // ASSETLER
        this.load.image('sky', 'https://labs.phaser.io/assets/skies/sky4.png');
        this.load.image('dirt', 'https://labs.phaser.io/assets/sprites/platform.png');
        this.load.image('grass', 'https://labs.phaser.io/assets/sprites/platform.png');
        this.load.image('apple', 'https://labs.phaser.io/assets/sprites/apple.png');
        this.load.image('boss_eye', 'https://labs.phaser.io/assets/sprites/slime.png');
        this.load.image('gate', 'https://labs.phaser.io/assets/sprites/longarrow.png');
        this.load.image('particle', 'https://labs.phaser.io/assets/particles/white.png');
        this.load.spritesheet('hero', 'https://labs.phaser.io/assets/sprites/dude.png', { frameWidth: 32, frameHeight: 48 });
        
        // UI Tuşları
        this.load.image('btn_left', 'https://labs.phaser.io/assets/sprites/arrow.png');
    }
    create() { this.scene.start('MenuScene'); }
}

class MenuScene extends Phaser.Scene {
    constructor() { super('MenuScene'); }
    create() {
        this.add.image(400, 225, 'sky').setScale(2).setTint(0x222222);
        this.add.text(400, 50, 'APPLE CELLS: 30 LEVELS', { fontSize: '42px', fill: '#f1c40f', fontStyle: 'bold' }).setOrigin(0.5);

        const levelsGrid = this.add.container(50, 100);
        for(let i = 1; i <= 30; i++) {
            let col = (i-1) % 10;
            let row = Math.floor((i-1) / 10);
            this.createLevelIcon(levelsGrid, col * 72, row * 80, i);
        }
    }

    createLevelIcon(container, x, y, level) {
        let box = this.add.rectangle(x, y, 60, 60, 0x34495e).setInteractive().setStrokeStyle(2, 0xecf0f1);
        let txt = this.add.text(x, y, level, { fontSize: '20px', fill: '#fff' }).setOrigin(0.5);
        
        box.on('pointerover', () => box.setFillStyle(0x2ecc71));
        box.on('pointerout', () => box.setFillStyle(0x34495e));
        box.on('pointerdown', () => this.scene.start('GameScene', { level: level }));
        
        container.add([box, txt]);
    }
}

class GameScene extends Phaser.Scene {
    constructor() { super('GameScene'); }

    init(data) {
        this.level = data.level || 1;
        this.playerHP = 100;
        this.bossHP = 100 + (this.level * 100);
        this.maxBossHP = this.bossHP;
        this.isAttacking = false;
        this.gold = 0;
        this.isDead = false;
    }

    create() {
        this.physics.world.setBounds(0, 0, WORLD_WIDTH, GAME_HEIGHT + 200);
        this.add.image(0, 0, 'sky').setOrigin(0).setScale(8).setTint(0x444444);

        // HARİTA OLUŞTURMA
        this.createTerrariaWorld();

        // KARAKTER
        this.player = this.physics.add.sprite(200, 300, 'hero');
        this.player.setCollideWorldBounds(true).setScale(1.2).setTint(0x3498db);
        this.cameras.main.startFollow(this.player, true, 0.1, 0.1);
        this.cameras.main.setBounds(0, 0, WORLD_WIDTH, GAME_HEIGHT);

        // GELİŞMİŞ BOSS AI
        this.createBoss();

        // KONTROL TUŞLARI (EKRAN ÜZERİ)
        this.createVirtualJoystick();

        // HUD & UI
        this.createHUD();
        
        // FİZİK ETKİLEŞİMLERİ
        this.setupPhysics();

        // KLAVYE
        this.cursors = this.input.keyboard.createCursorKeys();
        this.keySpace = this.input.keyboard.addKey('SPACE');
        this.keyShift = this.input.keyboard.addKey('SHIFT');
    }

    createTerrariaWorld() {
        this.platforms = this.physics.add.staticGroup();
        for(let i = 0; i < WORLD_WIDTH / 128; i++) {
            // Zemin
            this.platforms.create(i * 128, 430, 'dirt').setTint(0x5d4037).refreshBody();
            // Rastgele Mağara Blokları
            if(i > 5 && Math.random() < 0.2) {
                this.platforms.create(i * 128, Phaser.Math.Between(150, 300), 'dirt').setScale(0.5).setTint(0x2ecc71).refreshBody();
            }
        }
    }

    createBoss() {
        let spawnX = 1500 + (this.level * 200);
        this.boss = this.physics.add.sprite(spawnX, 350, 'boss_eye');
        this.boss.setTint(0xe74c3c).setScale(2 + (this.level * 0.2)).setBounce(0.5);
        this.boss.setCollideWorldBounds(true);
        this.boss.nextJump = 0;
    }

    createVirtualJoystick() {
        const style = { fontSize: '40px', fill: '#fff', backgroundColor: '#00000055', padding: 10 };
        this.btnLeft = this.add.text(50, 350, ' ◀ ', style).setScrollFactor(0).setInteractive();
        this.btnRight = this.add.text(150, 350, ' ▶ ', style).setScrollFactor(0).setInteractive();
        this.btnJump = this.add.text(650, 350, ' ▲ ', style).setScrollFactor(0).setInteractive();
        this.btnAttack = this.add.text(650, 250, ' ⚔ ', style).setScrollFactor(0).setInteractive();

        this.inputState = { left: false, right: false, jump: false };

        this.btnLeft.on('pointerdown', () => this.inputState.left = true);
        this.btnLeft.on('pointerup', () => this.inputState.left = false);
        this.btnRight.on('pointerdown', () => this.inputState.right = true);
        this.btnRight.on('pointerup', () => this.inputState.right = false);
        this.btnJump.on('pointerdown', () => this.inputState.jump = true);
        this.btnJump.on('pointerup', () => this.inputState.jump = false);
        this.btnAttack.on('pointerdown', () => this.executeAttack());
    }

    createHUD() {
        this.hud = this.add.graphics().setScrollFactor(0);
        this.infoText = this.add.text(20, 60, '', { fontSize: '18px', fill: '#f1c40f' }).setScrollFactor(0);
    }

    setupPhysics() {
        this.physics.add.collider(this.player, this.platforms);
        this.physics.add.collider(this.boss, this.platforms);
        this.physics.add.overlap(this.player, this.boss, this.handleDamage, null, this);
    }

    update(time) {
        if(this.isDead) return;

        // HAREKET
        let speed = this.keyShift.isDown ? 550 : 300;
        if (this.cursors.left.isDown || this.inputState.left) {
            this.player.setVelocityX(-speed);
            this.player.flipX = true;
        } else if (this.cursors.right.isDown || this.inputState.right) {
            this.player.setVelocityX(speed);
            this.player.flipX = false;
        } else {
            this.player.setVelocityX(0);
        }

        if ((this.cursors.up.isDown || this.inputState.jump) && this.player.body.touching.down) {
            this.player.setVelocityY(-700);
        }

        if (Phaser.Input.Keyboard.JustDown(this.keySpace)) this.executeAttack();

        // BOSS AI: AKILLI TAKİP VE ZIPLAMA
        if(this.boss.active) {
            let dist = this.player.x - this.boss.x;
            if(Math.abs(dist) < 1200) {
                this.boss.setVelocityX(dist > 0 ? 180 + (this.level * 5) : -180 - (this.level * 5));
                if(time > this.boss.nextJump && this.boss.body.touching.down) {
                    this.boss.setVelocityY(-550);
                    this.boss.nextJump = time + Phaser.Math.Between(1000, 3000);
                }
            }
        }

        this.drawUI();
    }

    executeAttack() {
        if(this.isAttacking) return;
        this.isAttacking = true;
        
        let range = this.add.rectangle(this.player.x + (this.player.flipX ? -60 : 60), this.player.y, 80, 40, 0xffffff, 0.3);
        
        if(this.boss.active && Phaser.Geom.Intersects.RectangleToRectangle(range.getBounds(), this.boss.getBounds())) {
            this.bossHP -= 25;
            this.boss.setTint(0xffffff);
            this.time.delayedCall(100, () => this.boss.setTint(0xe74c3c));
            if(this.bossHP <= 0) this.killBoss();
        }

        this.time.delayedCall(200, () => { range.destroy(); this.isAttacking = false; });
    }

    killBoss() {
        this.boss.destroy();
        this.add.text(this.player.x, 200, 'BÖLÜM TEMİZLENDİ!', { fontSize: '32px', fill: '#2ecc71' });
        this.time.delayedCall(2000, () => this.scene.start('MenuScene'));
    }

    handleDamage() {
        if(this.isAttacking) return;
        this.playerHP -= 0.3;
        this.player.setTint(0xff0000);
        this.time.delayedCall(100, () => this.player.setTint(0x3498db));
        if(this.playerHP <= 0) {
            this.isDead = true;
            alert("Öldün! Seviye: " + this.level);
            this.scene.start('MenuScene');
        }
    }

    drawUI() {
        this.hud.clear();
        // Player HP
        this.hud.fillStyle(0x000000, 0.5);
        this.hud.fillRect(20, 20, 200, 20);
        this.hud.fillStyle(0xe74c3c, 1);
        this.hud.fillRect(20, 20, this.playerHP * 2, 20);

        // Boss HP
        if(this.boss.active) {
            this.hud.fillStyle(0x000000, 0.5);
            this.hud.fillRect(580, 20, 200, 20);
            this.hud.fillStyle(0xf1c40f, 1);
            this.hud.fillRect(580, 20, (this.bossHP / this.maxBossHP) * 200, 20);
        }
        this.infoText.setText(`LEVEL: ${this.level} - BOSS HP: ${Math.floor(this.bossHP)}`);
    }
}

const config = {
    type: Phaser.AUTO,
    width: GAME_WIDTH,
    height: GAME_HEIGHT,
    parent: 'game-container',
    physics: { default: 'arcade', arcade: { gravity: { y: 1500 }, debug: false } },
    scene: [BootScene, MenuScene, GameScene]
};
const game = new Phaser.Game(config);
</script>
</body>
</html>
