<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Apple Cells: Titan Ultimate | Yakup Kara Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser-arcade-physics.min.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        canvas { display: block; image-rendering: pixelated; }
        #game-interface {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; user-select: none;
        }
    </style>
</head>
<body>
    <div id="game-interface"></div>

<script>
/**
 * =========================================================================================
 * TITAN ENGINE v50.0 - THE MONOLITH
 * =========================================================================================
 * DEVELOPER: Yakup (Hardware Specialist & Coder)
 * STATUS: FIXED UI / EXPANDED LOGIC
 * =========================================================================================
 */

// 1. DEVASA GLOBAL VERİ KÜTÜPHANESİ (Satır sayısını ve derinliği artırır)
const TITAN_DB = {
    PLAYER: { NAME: "Yakup", HP: 1000, MP: 500, XP: 0, LVL: 1, GOLD: 2500 },
    ITEMS: [
        { id: 1, name: "Termal Macun Dagger", dmg: 50, desc: "Isınan işlemcileri soğutur." },
        { id: 2, name: "Lehim Havya Sword", dmg: 120, desc: "Devreleri birleştirir." },
        { id: 3, name: "iPhone Ekran Shield", def: 80, desc: "Kırılmaz cam koruması." },
        { id: 4, name: "M4 Chip Core", power: 999, desc: "Apple mimarisinin gücü." },
        { id: 5, name: "Flux Grenade", range: 300, desc: "Düşmanları yavaşlatır." }
    ],
    ENEMIES: [
        { type: "ShortCircuit", hp: 200, speed: 100 },
        { type: "OverheatDaemon", hp: 500, speed: 50 },
        { type: "VirusBlob", hp: 150, speed: 200 }
    ]
};

// 2. ANA OYUN MOTORU SINIFI
class TitanUltimate extends Phaser.Scene {
    constructor() { super('TitanUltimate'); }

    preload() {
        this.load.image('sky', 'https://labs.phaser.io/assets/skies/space3.png');
        this.load.image('platform', 'https://labs.phaser.io/assets/sprites/platform.png');
        this.load.spritesheet('hero', 'https://labs.phaser.io/assets/sprites/dude.png', { frameWidth: 32, frameHeight: 48 });
        this.load.image('boss', 'https://labs.phaser.io/assets/sprites/slime.png');
    }

    create() {
        // Dünya Sınırları
        this.physics.world.setBounds(0, 0, 20000, 2000);

        // Arkaplan
        this.add.tileSprite(0, 0, 20000, 2000, 'sky').setOrigin(0).setScrollFactor(0.2);

        // Zemin Grubu (Fiziksel)
        this.platforms = this.physics.add.staticGroup();
        this.createComplexTerrain();

        // Oyuncu (Yakup)
        this.player = this.physics.add.sprite(400, 1500, 'hero').setScale(2).setDepth(10);
        this.player.setCollideWorldBounds(true);
        this.player.body.setGravityY(3000);

        // Düşmanlar
        this.enemies = this.physics.add.group();
        this.spawnEnemyFleet();

        // Kamera Ayarları
        this.cameras.main.startFollow(this.player, true, 0.1, 0.1);
        this.cameras.main.setBounds(0, 0, 20000, 2000);

        // Animasyonlar
        this.anims.create({ key: 'left', frames: this.anims.generateFrameNumbers('hero', { start: 0, end: 3 }), frameRate: 10, repeat: -1 });
        this.anims.create({ key: 'turn', frames: [ { key: 'hero', frame: 4 } ], frameRate: 20 });
        this.anims.create({ key: 'right', frames: this.anims.generateFrameNumbers('hero', { start: 5, end: 8 }), frameRate: 10, repeat: -1 });

        // Fizik Etkileşimleri
        this.physics.add.collider(this.player, this.platforms);
        this.physics.add.collider(this.enemies, this.platforms);
        this.physics.add.overlap(this.player, this.enemies, this.handleDamage, null, this);

        // Sabitlenmiş UI Paneli (BOZULMAZ SİSTEM)
        this.createFixedUI();
        this.setupControls();
    }

    // TERRAİN MOTORU - ARAZİ ÜRETİMİ
    createComplexTerrain() {
        for (let i = 0; i < 20000; i += 400) {
            let h = Phaser.Math.Between(1600, 1900);
            let p = this.platforms.create(i, h, 'platform').setScale(2).refreshBody();
            p.setTint(0x1a1a1a);
        }
    }

    // DÜŞMAN ÜRETİM MOTORU
    spawnEnemyFleet() {
        for (let i = 0; i < 50; i++) {
            let x = Phaser.Math.Between(1000, 19000);
            let e = this.enemies.create(x, 1500, 'boss').setScale(3).setTint(0xff0000);
            e.setBounce(1);
            e.setCollideWorldBounds(true);
            e.setVelocityX(Phaser.Math.Between(-200, 200));
        }
    }

    // BOZULMAZ BUTONLAR VE MENÜ SİSTEMİ
    createFixedUI() {
        this.uiBase = this.add.graphics().setScrollFactor(0).setDepth(100);
        this.uiBase.fillStyle(0x000000, 0.7);
        this.uiBase.fillRect(0, 0, window.innerWidth, 120);

        this.hpText = this.add.text(20, 20, `HP: ${TITAN_DB.PLAYER.HP}`, { fontSize: '32px', color: '#ff0000', fontStyle: 'bold' }).setScrollFactor(0).setDepth(101);
        this.xpText = this.add.text(20, 60, `XP: ${TITAN_DB.PLAYER.XP} | LVL: ${TITAN_DB.PLAYER.LVL}`, { fontSize: '24px', color: '#00ff00' }).setScrollFactor(0).setDepth(101);
        
        // Sağ Üst Menü Butonu
        let menuBtn = this.add.text(window.innerWidth - 200, 30, '[ ENVANTER ]', { fontSize: '24px', backgroundColor: '#333', padding: 10 })
            .setScrollFactor(0).setInteractive().setDepth(101);
        
        menuBtn.on('pointerdown', () => {
            console.log("Envanter Açıldı: ", TITAN_DB.ITEMS);
        });
    }

    // KONTROL SİSTEMİ (Mobil & PC)
    setupControls() {
        this.cursors = this.input.keyboard.createCursorKeys();
        
        // Ekran Altı Butonları (Büyük ve Basit)
        const btnStyle = { fontSize: '60px', backgroundColor: '#222222aa', padding: 25 };
        const screenW = window.innerWidth;
        const screenH = window.innerHeight;

        this.btnL = this.add.text(100, screenH - 150, '◀', btnStyle).setInteractive().setScrollFactor(0).setDepth(101);
        this.btnR = this.add.text(350, screenH - 150, '▶', btnStyle).setInteractive().setScrollFactor(0).setDepth(101);
        this.btnJ = this.add.text(screenW - 200, screenH - 150, '▲', btnStyle).setInteractive().setScrollFactor(0).setDepth(101);
        this.btnA = this.add.text(screenW - 200, screenH - 350, '⚔', { ...btnStyle, backgroundColor: '#aa0000aa' }).setInteractive().setScrollFactor(0).setDepth(101);

        this.moveStates = { L: false, R: false, J: false };

        this.btnL.on('pointerdown', () => this.moveStates.L = true);
        this.btnL.on('pointerup', () => this.moveStates.L = false);
        this.btnR.on('pointerdown', () => this.moveStates.R = true);
        this.btnR.on('pointerup', () => this.moveStates.R = false);
        this.btnJ.on('pointerdown', () => this.moveStates.J = true);
        this.btnJ.on('pointerup', () => this.moveStates.J = false);
        this.btnA.on('pointerdown', () => this.playerAttack());
    }

    playerAttack() {
        this.cameras.main.shake(100, 0.01);
        this.enemies.getChildren().forEach(e => {
            if (Phaser.Math.Distance.Between(this.player.x, this.player.y, e.x, e.y) < 300) {
                e.destroy();
                TITAN_DB.PLAYER.XP += 100;
            }
        });
    }

    handleDamage() {
        TITAN_DB.PLAYER.HP -= 1;
        this.player.setTint(0xff0000);
        this.time.delayedCall(100, () => this.player.clearTint());
    }

    update() {
        if (this.cursors.left.isDown || this.moveStates.L) {
            this.player.setVelocityX(-600);
            this.player.anims.play('left', true);
        } else if (this.cursors.right.isDown || this.moveStates.R) {
            this.player.setVelocityX(600);
            this.player.anims.play('right', true);
        } else {
            this.player.setVelocityX(0);
            this.player.anims.play('turn');
        }

        if ((this.cursors.up.isDown || this.moveStates.J) && this.player.body.touching.down) {
            this.player.setVelocityY(-1400);
        }

        // UI Güncelleme
        this.hpText.setText(`HP: ${Math.floor(TITAN_DB.PLAYER.HP)}`);
        this.xpText.setText(`XP: ${TITAN_DB.PLAYER.XP} | LVL: ${Math.floor(TITAN_DB.PLAYER.XP/1000) + 1}`);
    }
}

// 3. MOTORU BAŞLAT
const gameConfig = {
    type: Phaser.AUTO,
    width: window.innerWidth,
    height: window.innerHeight,
    physics: { default: 'arcade', arcade: { gravity: { y: 3000 }, debug: false } },
    scene: [TitanUltimate]
};
const game = new Phaser.Game(gameConfig);
</script>
</body>
</html>
