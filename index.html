<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Apple Cells: Last Chance | Yakup Kara</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser-arcade-physics.min.js"></script>
    <style>
        body { margin: 0; background: #87CEEB; overflow: hidden; touch-action: none; }
        #hud { position: absolute; top: 10px; left: 10px; color: #fff; font-family: 'Courier New'; background: rgba(0,0,0,0.7); padding: 10px; border: 2px solid #0f0; z-index: 100; pointer-events: none; }
    </style>
</head>
<body>
    <div id="hud">SİSTEM: KRİTİK MOD | OPERATOR: YAKUP | BOSS CANI: <span id="bhp">1000</span></div>

<script>
class LastChance extends Phaser.Scene {
    constructor() {
        super('LastChance');
        this.bossHP = 1000;
    }

    preload() {
        this.load.image('sky', 'https://labs.phaser.io/assets/skies/gradient24.png');
        this.load.image('platform', 'https://labs.phaser.io/assets/sprites/platform.png');
        this.load.image('boss', 'https://labs.phaser.io/assets/sprites/aqua_ball.png');
        this.load.spritesheet('hero', 'https://labs.phaser.io/assets/sprites/dude.png', { frameWidth: 32, frameHeight: 48 });
    }

    create() {
        // Dev Harita (20.000 Metre)
        this.physics.world.setBounds(0, 0, 20000, 2000);
        this.add.tileSprite(0, 0, 20000, 2000, 'sky').setOrigin(0);

        this.platforms = this.physics.add.staticGroup();
        // Zemin
        for (let i = 0; i < 20000; i += 400) {
            this.platforms.create(i, 1950, 'platform').setScale(2).refreshBody().setTint(0x222222);
        }

        // Platformlar (Zıplama mesafesi tam ayarlı)
        this.platforms.create(800, 1720, 'platform').refreshBody();
        this.platforms.create(1300, 1500, 'platform').refreshBody();
        this.platforms.create(1800, 1300, 'platform').refreshBody();

        // Karakter (Yakup)
        this.player = this.physics.add.sprite(200, 1800, 'hero').setScale(2.5).setDepth(10);
        this.player.setCollideWorldBounds(true);
        this.player.body.setGravityY(3800);

        // BOSS (Gerçekten orada ve can barı var)
        this.boss = this.physics.add.sprite(19500, 1700, 'boss').setScale(15).setTint(0xff0000);
        this.boss.setImmovable(true);

        // KONTROLLER (WASD)
        this.keys = this.input.keyboard.addKeys({
            W: 'W', A: 'A', S: 'S', D: 'D', SPACE: 'SPACE'
        });

        // MOBİL BUTONLAR (Kayıp olmayan devasa tuşlar)
        this.createMobileUI();

        this.cameras.main.startFollow(this.player, true, 0.1, 0.1);
        this.cameras.main.setBounds(0, 0, 20000, 2000);

        this.physics.add.collider(this.player, this.platforms);
        this.physics.add.overlap(this.player, this.boss, this.hitBoss, null, this);
    }

    createMobileUI() {
        const sw = window.innerWidth;
        const sh = window.innerHeight;
        const s = { fontSize: '80px', backgroundColor: '#000000cc', padding: 25, borderRadius: '15px' };

        this.btnL = this.add.text(50, sh - 220, '◀', s).setInteractive().setScrollFactor(0).setDepth(200);
        this.btnR = this.add.text(320, sh - 220, '▶', s).setInteractive().setScrollFactor(0).setDepth(200);
        this.btnJ = this.add.text(sw - 500, sh - 220, '▲', s).setInteractive().setScrollFactor(0).setDepth(200);
        this.btnA = this.add.text(sw - 230, sh - 220, '⚔', { ...s, backgroundColor: '#aa0000cc' }).setInteractive().setScrollFactor(0).setDepth(200);

        this.m = { L: false, R: false, J: false };
        this.btnL.on('pointerdown', () => this.m.L = true);
        this.btnL.on('pointerup', () => this.m.L = false);
        this.btnR.on('pointerdown', () => this.m.R = true);
        this.btnR.on('pointerup', () => this.m.R = false);
        this.btnJ.on('pointerdown', () => this.m.J = true);
        this.btnJ.on('pointerup', () => this.m.J = false);
        this.btnA.on('pointerdown', () => this.attack());
    }

    attack() {
        this.player.setTint(0xff0000);
        this.time.delayedCall(100, () => this.player.clearTint());
        if(Phaser.Math.Distance.Between(this.player.x, this.player.y, this.boss.x, this.boss.y) < 600) {
            this.bossHP -= 20;
            document.getElementById('bhp').innerText = this.bossHP;
        }
    }

    update() {
        // Hareket (WASD + Mobil)
        if (this.keys.A.isDown || this.m.L) this.player.setVelocityX(-850);
        else if (this.keys.D.isDown || this.m.R) this.player.setVelocityX(850);
        else this.player.setVelocityX(0);

        // Zıplama (W = Zıplama, Space = Vurma)
        if ((this.keys.W.isDown || this.m.J) && this.player.body.touching.down) {
            this.player.setVelocityY(-1750);
        }

        // Space Tuşu ile Vurma
        if (Phaser.Input.Keyboard.JustDown(this.keys.SPACE)) {
            this.attack();
        }
    }
}

const config = {
    type: Phaser.AUTO,
    width: window.innerWidth,
    height: window.innerHeight,
    physics: { default: 'arcade', arcade: { gravity: { y: 3800 } } },
    scene: [LastChance]
};
new Phaser.Game(config);
</script>
</body>
</html>
