<!DOCTYPE html>
<html>
<head>
    <title>Knight Knight: Apple Cells</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser-arcade-physics.min.js"></script>
    <style>
        body { margin: 0; background: #2c3e50; overflow: hidden; font-family: 'Courier New', Courier, monospace; }
        canvas { display: block; margin: 0 auto; border: 4px solid #ecf0f1; }
    </style>
</head>
<body>

<script>
let player, cursors, platforms, coins, enemies, scoreText, levelText;
let score = 0;
let currentLevel = 1;
let canAttack = true;
let isDead = false;

const config = {
    type: Phaser.AUTO,
    width: 800,
    height: 450,
    physics: {
        default: 'arcade',
        arcade: { gravity: { y: 1200 }, debug: false }
    },
    scene: { preload: preload, create: create, update: update }
};

const game = new Phaser.Game(config);

function preload() {
    // Apple Knight tarzı daha canlı renkler
    this.load.image('sky', 'https://labs.phaser.io/assets/skies/big-clouds.png');
    this.load.image('ground', 'https://labs.phaser.io/assets/sprites/platform.png');
    this.load.image('coin', 'https://labs.phaser.io/assets/sprites/apple.png'); // Para yerine elma!
    this.load.image('slime', 'https://labs.phaser.io/assets/sprites/slime.png');
    this.load.spritesheet('knight', 'https://labs.phaser.io/assets/sprites/dude.png', { frameWidth: 32, frameHeight: 48 });
}

function create() {
    // Menü Sistemi (Şimdilik basit bir giriş)
    if (confirm("Seviye Seç: 1-10 Arası (Tamam dersen Seviye " + currentLevel + " başlar)")) {
        setupGame.call(this);
    }
}

function setupGame() {
    this.add.image(400, 225, 'sky').setScrollFactor(0).setScale(2);

    platforms = this.physics.add.staticGroup();
    // Seviyeye göre platformları uzat
    for (let i = 0; i < currentLevel + 2; i++) {
        platforms.create(400 * i, 420, 'ground').setScale(2).refreshBody();
    }
    platforms.create(600, 300, 'ground');
    platforms.create(1000, 250, 'ground');

    // Oyuncu (Karakter Güzelleştirme: Mavi Kostüm)
    player = this.physics.add.sprite(100, 300, 'knight');
    player.setBounce(0.1);
    player.setCollideWorldBounds(true);
    player.setTint(0x3498db); 

    // Kamera
    this.cameras.main.setBounds(0, 0, 2000, 600);
    this.cameras.main.startFollow(player, true, 0.1, 0.1);

    // Paralar
    coins = this.physics.add.group({
        key: 'coin',
        repeat: 10 + (currentLevel * 2),
        setXY: { x: 300, y: 0, stepX: 150 }
    });

    // Düşmanlar (Seviye sonu Boss mantığı)
    enemies = this.physics.add.group();
    let boss = enemies.create(1500, 350, 'slime');
    boss.setTint(0x000000); // Siyah Dev Slime (Boss)
    boss.setScale(2 + (currentLevel * 0.5));
    boss.setVelocityX(100);

    // UI
    scoreText = this.add.text(16, 16, 'Altın: 0', { fontSize: '24px', fill: '#fff' }).setScrollFactor(0);
    levelText = this.add.text(650, 16, 'Seviye: ' + currentLevel, { fontSize: '24px', fill: '#f1c40f' }).setScrollFactor(0);

    // Kontroller
    cursors = this.input.keyboard.createCursorKeys();
    attackKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE);
    dashKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SHIFT);

    // Çarpışmalar
    this.physics.add.collider(player, platforms);
    this.physics.add.collider(enemies, platforms);
    this.physics.add.collider(coins, platforms);
    this.physics.add.overlap(player, coins, collectCoin, null, this);
    this.physics.add.overlap(player, enemies, hitEnemy, null, this);
}

function update() {
    if (isDead) return;

    // Hız Sistemi (Dead Cells gibi akıcı)
    let speed = 300;
    if (dashKey.isDown) speed = 600; // Dash hızı

    if (cursors.left.isDown) {
        player.setVelocityX(-speed);
        player.flipX = true;
    } else if (cursors.right.isDown) {
        player.setVelocityX(speed);
        player.flipX = false;
    } else {
        player.setVelocityX(0);
    }

    if (cursors.up.isDown && player.body.touching.down) {
        player.setVelocityY(-650);
    }

    // Kılıç Saldırısı
    if (Phaser.Input.Keyboard.JustDown(attackKey) && canAttack) {
        player.setTint(0xffffff); // Saldırı parlaması
        canAttack = false;
        
        // Saldırı menzilindeki düşmanları yok et
        enemies.children.iterate((enemy) => {
            if (enemy && Phaser.Math.Distance.Between(player.x, player.y, enemy.x, enemy.y) < 100) {
                enemy.destroy();
                score += 50;
                scoreText.setText('Altın: ' + score);
                nextLevel.call(this);
            }
        });

        this.time.delayedCall(300, () => {
            player.setTint(0x3498db);
            canAttack = true;
        });
    }
}

function collectCoin(player, coin) {
    coin.disableBody(true, true);
    score += 10;
    scoreText.setText('Altın: ' + score);
}

function hitEnemy(player, enemy) {
    if (canAttack === false) return; // Saldırırken hasar almaz
    this.physics.pause();
    player.setTint(0xff0000);
    isDead = true;
    alert("Öldün! Toplanan Altın: " + score);
    location.reload();
}

function nextLevel() {
    if (currentLevel < 10) {
        alert("Boss Yenildi! Seviye " + (currentLevel + 1) + " Hazır!");
        currentLevel++;
        this.scene.restart();
    } else {
        alert("TEBRİKLER! OYUNU BİTİRDİN!");
    }
}
</script>
</body>
</html>
