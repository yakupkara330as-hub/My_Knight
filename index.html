<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple Cells: Titan Engine | Yakup Kara Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser-arcade-physics.min.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Consolas', 'Courier New', monospace; }
        #game-container { cursor: crosshair; }
        .ui-layer { position: absolute; pointer-events: none; color: white; width: 100%; }
    </style>
</head>
<body>
    <div id="game-container"></div>

<script>
/**
 * ============================================================================
 * TITAN ENGINE - ADVANCED TERRARIA CLONE V6.0
 * ============================================================================
 * Geliştirici: Yakup
 * Sınıf: 6. Sınıf Öğrencisi ve Kod Uzmanı
 * 
 * Bu motorun özellikleri:
 * 1. Procedural World Generation (Rastgele Dünya)
 * 2. Smart Boss AI (Çok Fazlı Yapay Zeka)
 * 3. Mobile/PC Hybrid Controls (Hibrit Kontroller)
 * 4. Inventory & Logic Systems (Mantık Sistemleri)
 * ============================================================================
 */

// --- GLOBAL CONFIGURATION (Motor Ayarları) ---
const TITAN_SETTINGS = {
    WIDTH: 800,
    HEIGHT: 600,
    TILE_SIZE: 32,
    CHUNK_SIZE: 16,
    TOTAL_LEVELS: 30, // 30 Adet farklı seviye kapasitesi
    PHYSICS: {
        GRAVITY: 2200,
        MAX_SPEED: 450,
        JUMP_FORCE: -900
    },
    BIOMES: ['Forest', 'Desert', 'DeepCave', 'BossArena']
};

// --- DATA PERSISTENCE LAYER (Veri Yönetimi) ---
class GameDataManager {
    constructor() {
        this.player = {
            name: "Yakup",
            level: 1,
            hp: 100,
            gold: 0,
            xp: 0
        };
        this.inventory = new Map();
        this.settings = { sound: true, difficulty: 'Pro' };
    }

    addItem(item, qty) {
        let count = this.inventory.get(item) || 0;
        this.inventory.set(item, count + qty);
    }
}
const GAME_DB = new GameDataManager();

// --- SCENE 1: BOOT & LOAD (Yükleme ve Başlatma) ---
class BootScene extends Phaser.Scene {
    constructor() { super('BootScene'); }

    preload() {
        this.renderPreloader();
        
        // Asset Loading (Varlık Yükleme)
        this.load.image('sky_day', 'https://labs.phaser.io/assets/skies/sky4.png');
        this.load.image('sky_night', 'https://labs.phaser.io/assets/skies/space3.png');
        this.load.image('tile_grass', 'https://labs.phaser.io/assets/sprites/platform.png');
        this.load.image('tile_dirt', 'https://labs.phaser.io/assets/sprites/platform.png');
        this.load.image('apple_gold', 'https://labs.phaser.io/assets/sprites/apple.png');
        this.load.image('particle_fire', 'https://labs.phaser.io/assets/particles/muzzleflash3.png');
        this.load.image('boss_eye_v1', 'https://labs.phaser.io/assets/sprites/slime.png');
        this.load.image('boss_eye_v2', 'https://labs.phaser.io/assets/sprites/aqua_ball.png');
        this.load.spritesheet('hero_sheet', 'https://labs.phaser.io/assets/sprites/dude.png', { frameWidth: 32, frameHeight: 48 });
    }

    renderPreloader() {
        let bar = this.add.graphics();
        this.load.on('progress', (p) => {
            bar.clear();
            bar.fillStyle(0x00ff88, 1);
            bar.fillRect(200, 290, 400 * p, 20);
        });
    }

    create() { this.scene.start('MenuScene'); }
}

// --- SCENE 2: PRO MENU (Gelişmiş Menü Sistemi) ---
class MenuScene extends Phaser.Scene {
    constructor() { super('MenuScene'); }

    create() {
        this.add.image(400, 300, 'sky_night').setAlpha(0.6);
        this.add.text(400, 80, 'TITAN ENGINE V6', { fontSize: '64px', fill: '#00ff88', fontStyle: 'bold' }).setOrigin(0.5);
        this.add.text(400, 130, 'DEVELOPED BY YAKUP KARA', { fontSize: '18px', fill: '#ffffff' }).setOrigin(0.5);

        const levelGrid = this.add.container(80, 200);
        this.createLevelGrid(levelGrid);
    }

    createLevelGrid(container) {
        for (let i = 1; i <= TITAN_SETTINGS.TOTAL_LEVELS; i++) {
            let col = (i - 1) % 10;
            let row = Math.floor((i - 1) / 10);
            
            let btn = this.add.rectangle(col * 65, row * 85, 55, 75, 0x1a1a1a).setStrokeStyle(2, 0x00ff88).setInteractive();
            let txt = this.add.text(col * 65, row * 85, i, { fontSize: '20px' }).setOrigin(0.5);

            btn.on('pointerdown', () => this.scene.start('GameScene', { level: i }));
            btn.on('pointerover', () => btn.setFillStyle(0x004433));
            btn.on('pointerout', () => btn.setFillStyle(0x1a1a1a));
            
            container.add([btn, txt]);
        }
    }
}

// --- SCENE 3: CORE GAMEPLAY (Ana Oyun Motoru) ---
class GameScene extends Phaser.Scene {
    constructor() { super('GameScene'); }

    init(data) {
        this.level = data.level || 1;
        this.hp = 100;
        this.bossHp = 500 + (this.level * 250);
        this.maxBossHp = this.bossHp;
        this.bossPhase = 1;
        this.isGameOver = false;
        this.inputState = { left: false, right: false, up: false, attack: false };
    }

    create() {
        this.worldWidth = 10000; // Çok geniş Terraria dünyası
        this.physics.world.setBounds(0, 0, this.worldWidth, 800);

        this.initSystems();
        this.initWorld();
        this.initPlayer();
        this.initBossAI();
        this.initUI();
        this.initParticles();
        this.initInputHandlers();
    }

    // --- MODÜLER SİSTEM BAŞLATICI ---
    
    initSystems() {
        this.cameras.main.setBackgroundColor('#1a1a1a');
        this.cameras.main.setBounds(0, 0, this.worldWidth, 600);
        this.bg = this.add.tileSprite(0, 0, 800, 600, 'sky_day').setOrigin(0).setScrollFactor(0);
    }

    initWorld() {
        this.platforms = this.physics.add.staticGroup();
        // Procedural Generation (Rastgele Yapılandırma)
        for(let x = 0; x < this.worldWidth; x += 128) {
            this.platforms.create(x, 570, 'tile_grass').setTint(0x2d5a27).refreshBody();
            
            // Yer Altı Katmanları
            if (Math.random() > 0.5) {
                this.platforms.create(x, 634, 'tile_dirt').setTint(0x4a2e12).refreshBody();
            }

            // Havada Asılı Adalar
            if (x > 800 && Math.random() < 0.2) {
                let py = Phaser.Math.Between(250, 450);
                this.platforms.create(x, py, 'tile_dirt').setScale(0.5).setTint(0x333333).refreshBody();
            }
        }
    }

    initPlayer() {
        this.player = this.physics.add.sprite(200, 400, 'hero_sheet');
        this.player.setCollideWorldBounds(true).setScale(1.2).setDepth(20);
        this.player.body.setGravityY(TITAN_SETTINGS.PHYSICS.GRAVITY);
        
        this.cameras.main.startFollow(this.player, true, 0.1, 0.1);

        // Animasyonlar
        this.anims.create({ key: 'run', frames: this.anims.generateFrameNumbers('hero_sheet', {start: 5, end: 8}), frameRate: 12, repeat: -1 });
        this.anims.create({ key: 'idle', frames: [{key: 'hero_sheet', frame: 4}], frameRate: 1 });
    }

    initBossAI() {
        let spawnX = 2000 + (this.level * 300);
        this.boss = this.physics.add.sprite(spawnX, 300, 'boss_eye_v1');
        this.boss.setTint(0xff3333).setScale(4).setBounce(1);
        this.boss.body.setAllowGravity(false);
        this.boss.setData('state', 'FOLLOW');
    }

    initUI() {
        this.hud = this.add.graphics().setScrollFactor(0).setDepth(1000);
        this.infoText = this.add.text(20, 20, '', { fontSize: '20px', fontStyle: 'bold', fill: '#00ff88' }).setScrollFactor(0);
    }

    initParticles() {
        this.fire = this.add.particles(0, 0, 'particle_fire', {
            speed: 150,
            scale: { start: 0.4, end: 0 },
            blendMode: 'ADD',
            lifespan: 400,
            emitting: false
        });
    }

    initInputHandlers() {
        this.cursors = this.input.keyboard.createCursorKeys();
        this.keyA = this.input.keyboard.addKey('A');
        this.keyD = this.input.keyboard.addKey('D');
        this.keyW = this.input.keyboard.addKey('W');
        this.keySpace = this.input.keyboard.addKey('SPACE');

        // Mobil Kontrol Butonları
        const btnStyle = { fontSize: '40px', backgroundColor: '#00000088', padding: 12 };
        
        const bL = this.add.text(60, 480, ' ◀ ', btnStyle).setScrollFactor(0).setInteractive().setDepth(1100);
        const bR = this.add.text(180, 480, ' ▶ ', btnStyle).setScrollFactor(0).setInteractive().setDepth(1100);
        const bJ = this.add.text(640, 480, ' ⬆ ', btnStyle).setScrollFactor(0).setInteractive().setDepth(1100);
        const bA = this.add.text(640, 360, ' ⚔ ', btnStyle).setScrollFactor(0).setInteractive().setDepth(1100);

        bL.on('pointerdown', () => this.inputState.left = true);
        bL.on('pointerup', () => this.inputState.left = false);
        bR.on('pointerdown', () => this.inputState.right = true);
        bR.on('pointerup', () => this.inputState.right = false);
        bJ.on('pointerdown', () => this.inputState.up = true);
        bJ.on('pointerup', () => this.inputState.up = false);
        bA.on('pointerdown', () => this.handleCombat());
        
        // Çarpışmalar
        this.physics.add.collider(this.player, this.platforms);
        this.physics.add.collider(this.boss, this.platforms);
        this.physics.add.overlap(this.player, this.boss, this.handleDamage, null, this);
    }

    // --- ENGINE CORE LOOP (Oyun Döngüsü) ---

    update(time, delta) {
        if (this.isGameOver) return;

        this.processMovement();
        this.processBossLogic(time);
        this.updateHUD();
    }

    processMovement() {
        let speed = TITAN_SETTINGS.PHYSICS.MAX_SPEED;

        if (this.cursors.left.isDown || this.keyA.isDown || this.inputState.left) {
            this.player.setVelocityX(-speed);
            this.player.flipX = true;
            this.player.anims.play('run', true);
        } else if (this.cursors.right.isDown || this.keyD.isDown || this.inputState.right) {
            this.player.setVelocityX(speed);
            this.player.flipX = false;
            this.player.anims.play('run', true);
        } else {
            this.player.setVelocityX(0);
            this.player.anims.play('idle');
        }

        if ((this.cursors.up.isDown || this.keyW.isDown || this.inputState.up) && this.player.body.touching.down) {
            this.player.setVelocityY(TITAN_SETTINGS.PHYSICS.JUMP_FORCE);
        }

        if (Phaser.Input.Keyboard.JustDown(this.keySpace)) this.handleCombat();
    }

    processBossLogic(time) {
        if (!this.boss.active) return;

        // Phase 2 Transition (Terraria Style)
        if (this.bossHp < this.maxBossHp * 0.5 && this.bossPhase === 1) {
            this.bossPhase = 2;
            this.boss.setTexture('boss_eye_v2');
            this.boss.setTint(0xffff00);
            this.boss.setScale(6);
            this.cameras.main.shake(500, 0.01);
        }

        let dist = Phaser.Math.Distance.Between(this.player.x, this.player.y, this.boss.x, this.boss.y);
        if (dist < 1200) {
            let bossSpeed = this.bossPhase === 2 ? 350 : 200;
            this.physics.moveToObject(this.boss, this.player, bossSpeed + (this.level * 10));
        }
    }

    handleCombat() {
        let isRight = !this.player.flipX;
        let atkBox = new Phaser.Geom.Rectangle(this.player.x + (isRight ? 50 : -130), this.player.y - 40, 80, 80);
        
        let visualAtk = this.add.rectangle(atkBox.x + 40, atkBox.y + 40, 80, 80, 0x00ffff, 0.3);
        this.time.delayedCall(100, () => visualAtk.destroy());

        if (this.boss.active && Phaser.Geom.Intersects.RectangleToRectangle(atkBox, this.boss.getBounds())) {
            this.bossHp -= 50;
            this.fire.emitParticleAt(this.boss.x, this.boss.y, 20);
            this.boss.setTint(0xffffff);
            this.time.delayedCall(100, () => this.boss.setTint(0xff3333));
            if (this.bossHp <= 0) this.winLevel();
        }
    }

    handleDamage() {
        this.hp -= 0.5;
        this.player.setTint(0xff0000);
        this.time.delayedCall(100, () => this.player.clearTint());
        if (this.hp <= 0) this.gameOver();
    }

    updateHUD() {
        this.hud.clear();
        // Player HP
        this.hud.fillStyle(0x000000, 0.7);
        this.hud.fillRect(20, 60, 204, 24);
        this.hudGraphics(22, 62, (this.hp/100)*200, 20, 0x00ff88);

        // Boss HP
        if (this.boss.active) {
            this.hud.fillStyle(0x000000, 0.8);
            this.hud.fillRect(200, 20, 400, 30);
            this.hudGraphics(202, 22, (this.bossHp/this.maxBossHp)*396, 26, 0xff3333);
        }

        this.infoText.setText([
            `KAHRAMAN: YAKUP`,
            `SEVİYE: ${this.level} / 30`,
            `MOD: ${this.bossPhase === 2 ? 'ÖFKELİ' : 'NORMAL'}`
        ]);
    }

    hudGraphics(x, y, w, h, color) {
        this.hud.fillStyle(color, 1);
        this.hud.fillRect(x, y, w, h);
    }

    winLevel() {
        this.boss.destroy();
        this.add.text(this.player.x, 300, "SEVİYE TAMAMLANDI!", { fontSize: '42px', fill: '#00ff88', fontStyle: 'bold' }).setOrigin(0.5);
        this.time.delayedCall(3000, () => this.scene.start('MenuScene'));
    }

    gameOver() {
        this.isGameOver = true;
        this.physics.pause();
        this.add.rectangle(400, 300, 800, 600, 0x000000, 0.8).setScrollFactor(0);
        this.add.text(400, 300, "OYUN BİTTİ", { fontSize: '64px', fill: '#ff0000' }).setOrigin(0.5).setScrollFactor(0);
        this.time.delayedCall(3000, () => this.scene.start('MenuScene'));
    }
}

// --- ENGINE INITIALIZATION (Başlatıcı) ---
const config = {
    type: Phaser.AUTO,
    width: TITAN_SETTINGS.WIDTH,
    height: TITAN_SETTINGS.HEIGHT,
    parent: 'game-container',
    physics: { default: 'arcade', arcade: { gravity: { y: TITAN_SETTINGS.PHYSICS.GRAVITY }, debug: false } },
    scene: [BootScene, MenuScene, GameScene]
};
const game = new Phaser.Game(config);

 */
</script>
</body>
</html>
