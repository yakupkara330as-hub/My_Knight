<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Apple Cells: Master Build | Yakup Kara</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser-arcade-physics.min.js"></script>
    <style>
        body { margin: 0; background: #0b0d10; overflow: hidden; touch-action: none; font-family: 'Segoe UI', sans-serif; }
        canvas { image-rendering: pixelated; }
        #ui-layer { position: absolute; top: 10px; left: 10px; pointer-events: none; z-index: 100; color: #fff; }
    </style>
</head>
<body>
    <div id="ui-layer">
        <div style="background: rgba(0,0,0,0.8); padding: 12px; border-radius: 8px; border: 2px solid #2ecc71;">
            LVL: <span id="lvl">1</span> | BOSS HP: <span id="bhp">100</span>
        </div>
    </div>

<script>
/**
 * APPLE CELLS: MASTER BUILD - YAKUP KARA
 * PC KONTROLLER: WASD (Hareket), SPACE (Saldırı), SHIFT (Hız)
 * MOBİL KONTROLLER: Sabit ve Büyük Butonlar
 */

class BootScene extends Phaser.Scene {
    constructor() { super('BootScene'); }
    preload() {
        this.load.image('sky', 'https://labs.phaser.io/assets/skies/sky4.png');
        this.load.image('dirt', 'https://labs.phaser.io/assets/sprites/platform.png');
        this.load.image('boss', 'https://labs.phaser.io/assets/sprites/slime.png');
        this.load.spritesheet('hero', 'https://labs.phaser.io/assets/sprites/dude.png', { frameWidth: 32, frameHeight: 48 });
    }
    create() { this.scene.start('MenuScene'); }
}

class MenuScene extends Phaser.Scene {
    constructor() { super('MenuScene'); }
    create() {
        this.add.image(400, 225, 'sky').setScale(2).setTint(0x111111);
        this.add.text(400, 40, 'APPLE CELLS: 30 LEVELS', { fontSize: '36px', fill: '#f1c40f', fontStyle: 'bold' }).setOrigin(0.5);

        const grid = this.add.container(60, 80);
        for(let i = 1; i <= 30; i++) {
            let col = (i-1) % 10;
            let row = Math.floor((i-1) / 10);
            let btn = this.add.rectangle(col*72, row*75, 60, 60, 0x2c3e50).setInteractive().setStrokeStyle(2, 0xffffff);
            let txt = this.add.text(col*72, row*75, i, { fontSize: '22px' }).setOrigin(0.5);
            btn.on('pointerdown', () => this.scene.start('GameScene', { level: i }));
            grid.add([btn, txt]);
        }
    }
}

class GameScene extends Phaser.Scene {
    constructor() { super('GameScene'); }
    init(data) {
        this.level = data.level || 1;
        this.playerHP = 100;
        this.bossHP = 100 + (this.level * 100);
        this.maxBossHP = this.bossHP;
        this.isAttacking = false;
        this.isDead = false;
    }

    create() {
        this.physics.world.setBounds(0, 0, 8000, 600);
        this.add.tileSprite(0, 0, 8000, 600, 'sky').setOrigin(0).setTint(0x333333).setScale(2);

        this.platforms = this.physics.add.staticGroup();
        for(let i = 0; i < 65; i++) {
            this.platforms.create(i * 128, 580, 'dirt').setTint(0x5d4037).refreshBody();
            if(i > 5 && Math.random() < 0.25) {
                this.platforms.create(i*128, Phaser.Math.Between(250, 400), 'dirt').setScale(0.5).setTint(0x2ecc71).refreshBody();
            }
        }

        this.player = this.physics.add.sprite(200, 400, 'hero').setScale(1.6).setTint(0x3498db);
        this.player.setCollideWorldBounds(true).body.setGravityY(1600);
        this.cameras.main.startFollow(this.player, true, 0.1, 0.1);

        let spawnX = 1500 + (this.level * 150);
        this.boss = this.physics.add.sprite(spawnX, 400, 'boss').setTint(0xe74c3c).setScale(2 + (this.level * 0.15));
        this.boss.setCollideWorldBounds(true).setBounce(0.3);

        this.cursors = this.input.keyboard.createCursorKeys();
        this.keys = this.input.keyboard.addKeys('W,A,S,D,SPACE,SHIFT');
        this.createMobileButtons();

        this.physics.add.collider(this.player, this.platforms);
        this.physics.add.collider(this.boss, this.platforms);
        this.physics.add.overlap(this.player, this.boss, () => this.handleDamage());

        this.anims.create({ key: 'walk', frames: this.anims.generateFrameNumbers('hero', { start: 5, end: 8 }), frameRate: 12, repeat: -1 });
        this.anims.create({ key: 'idle', frames: [ { key: 'hero', frame: 4 } ], frameRate: 20 });
    }

    createMobileButtons() {
        const { width: w, height: h } = this.scale;
        const style = { fontSize: '65px', backgroundColor: '#000000aa', padding: 20, borderRadius: '15px' };
        
        this.mCtrl = { L: false, R: false, J: false };
        this.btnL = this.add.text(50, h-160, '◀', style).setScrollFactor(0).setInteractive().setDepth(1000);
        this.btnR = this.add.text(230, h-160, '▶', style).setScrollFactor(0).setInteractive().setDepth(1000);
        this.btnJ = this.add.text(w-320, h-160, '▲', style).setScrollFactor(0).setInteractive().setDepth(1000);
        this.btnA = this.add.text(w-150, h-160, '⚔', { ...style, backgroundColor: '#880000aa' }).setScrollFactor(0).setInteractive().setDepth(1000);

        this.btnL.on('pointerdown', () => this.mCtrl.L = true); this.btnL.on('pointerup', () => this.mCtrl.L = false);
        this.btnR.on('pointerdown', () => this.mCtrl.R = true); this.btnR.on('pointerup', () => this.mCtrl.R = false);
        this.btnJ.on('pointerdown', () => this.mCtrl.J = true); this.btnJ.on('pointerup', () => this.mCtrl.J = false);
        this.btnA.on('pointerdown', () => this.executeAttack());
    }

    executeAttack() {
        if(this.isAttacking) return;
        this.isAttacking = true;
        this.player.setTint(0xffffff);
        if(Phaser.Math.Distance.Between(this.player.x, this.player.y, this.boss.x, this.boss.y) < 180) {
            this.bossHP -= 25;
            this.boss.setTint(0xffffff);
            this.time.delayedCall(100, () => this.boss.setTint(0xe74c3c));
        }
        this.time.delayedCall(250, () => { this.player.setTint(0x3498db); this.isAttacking = false; });
    }

    handleDamage() {
        if(this.isAttacking) return;
        this.playerHP -= 0.5;
        this.player.setTint(0xff0000);
        this.time.delayedCall(100, () => this.player.setTint(0x3498db));
        if(this.playerHP <= 0) this.scene.start('MenuScene');
    }

    update(time) {
        let speed = (this.keys.SHIFT.isDown) ? 550 : 300;
        if (this.keys.A.isDown || this.cursors.left.isDown || this.mCtrl.L) {
            this.player.setVelocityX(-speed); this.player.flipX = true; this.player.anims.play('walk', true);
        } else if (this.keys.D.isDown || this.cursors.right.isDown || this.mCtrl.R) {
            this.player.setVelocityX(speed); this.player.flipX = false; this.player.anims.play('walk', true);
        } else {
            this.player.setVelocityX(0); this.player.anims.play('idle');
        }

        if ((this.keys.W.isDown || this.cursors.up.isDown || this.mCtrl.J) && this.player.body.touching.down) {
            this.player.setVelocityY(-850);
        }

        if (Phaser.Input.Keyboard.JustDown(this.keys.SPACE)) this.executeAttack();

        // Boss AI
        if(this.boss.active) {
            let dist = this.player.x - this.boss.x;
            if(Math.abs(dist) < 1000) {
                this.boss.setVelocityX(dist > 0 ? 180 + (this.level*5) : -180 - (this.level*5));
                if(this.boss.body.touching.down && Math.random() < 0.02) this.boss.setVelocityY(-600);
            }
        }

        document.getElementById('lvl').innerText = this.level;
        document.getElementById('bhp').innerText = Math.floor(this.bossHP);
        if(this.bossHP <= 0) { this.boss.destroy(); this.time.delayedCall(1500, () => this.scene.start('MenuScene')); }
    }
}

const config = { type: Phaser.AUTO, width: 800, height: 450, parent: 'game-container', physics: { default: 'arcade', arcade: { gravity: { y: 1600 } } }, scene: [BootScene, MenuScene, GameScene] };
new Phaser.Game(config);
</script>
</body>
</html>
