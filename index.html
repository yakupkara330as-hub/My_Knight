<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Apple Cells: My Knight | Yakup Kara</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser-arcade-physics.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #87CEEB; overflow: hidden; touch-action: none; }
        #game-ui { position: absolute; top: 10px; left: 10px; z-index: 100; pointer-events: none; }
        .stat { background: rgba(0,0,0,0.8); color: #0f0; padding: 8px; border: 1px solid #0f0; font-family: monospace; margin-bottom: 5px; }
    </style>
</head>
<body>
    <div id="game-ui">
        <div class="stat">ŞOVALYE: YAKUP</div>
        <div class="stat">BOSS CANI: <span id="boss-hp">1000</span></div>
    </div>

<script>
class MyKnightLegacy extends Phaser.Scene {
    constructor() {
        super('MyKnightLegacy');
        this.bossHP = 1000;
        this.isAttacking = false;
    }

    preload() {
        this.load.image('sky', 'https://labs.phaser.io/assets/skies/gradient24.png');
        this.load.image('floor', 'https://labs.phaser.io/assets/sprites/platform.png');
        this.load.image('enemy', 'https://labs.phaser.io/assets/sprites/aqua_ball.png');
        this.load.spritesheet('knight', 'https://labs.phaser.io/assets/sprites/dude.png', { frameWidth: 32, frameHeight: 48 });
    }

    create() {
        // Harita Sınırları
        this.physics.world.setBounds(0, 0, 10000, 2000);
        this.add.tileSprite(0, 0, 10000, 2000, 'sky').setOrigin(0);

        this.platforms = this.physics.add.staticGroup();
        // Zemin ve Seviye Platformları (Zıplama mesafesi Yakup'un istediği gibi)
        for (let i = 0; i < 10000; i += 400) {
            this.platforms.create(i, 1950, 'floor').setScale(2).refreshBody().setTint(0x2d2d2d);
        }
        
        // Atlanabilir Platformlar (Sıralı ve Ulaşılabilir)
        this.platforms.create(600, 1750, 'floor').refreshBody();
        this.platforms.create(1100, 1550, 'floor').refreshBody();
        this.platforms.create(1600, 1350, 'floor').refreshBody();

        // Karakter (Şovalye Yakup)
        this.player = this.physics.add.sprite(200, 1850, 'knight').setScale(2.5).setDepth(10);
        this.player.setCollideWorldBounds(true);
        this.player.body.setGravityY(4000);

        // BOSS (Bölüm Sonu)
        this.boss = this.physics.add.sprite(9500, 1850, 'enemy').setScale(12).setTint(0xff0000);
        this.boss.setImmovable(true);

        // Kamera
        this.cameras.main.startFollow(this.player, true, 0.1, 0.1);
        this.cameras.main.setBounds(0, 0, 10000, 2000);

        // Klavye
        this.keys = this.input.keyboard.addKeys({
            W: 'W', A: 'A', S: 'S', D: 'D', SPACE: 'SPACE'
        });

        // MOBİL DÜĞMELER (Hizasında ve Büyük)
        this.createMobileControls();

        // Çarpışmalar
        this.physics.add.collider(this.player, this.platforms);
        this.physics.add.overlap(this.player, this.boss, this.doDamage, null, this);
    }

    createMobileControls() {
        const { width: sw, height: sh } = this.scale;
        const btnStyle = { fontSize: '70px', backgroundColor: '#000000aa', padding: 20, borderRadius: '10px' };

        // Sol/Sağ
        this.btnL = this.add.text(50, sh - 180, '◀', btnStyle).setInteractive().setScrollFactor(0).setDepth(200);
        this.btnR = this.add.text(250, sh - 180, '▶', btnStyle).setInteractive().setScrollFactor(0).setDepth(200);
        
        // Zıplama/Vurma
        this.btnJ = this.add.text(sw - 420, sh - 180, '▲', btnStyle).setInteractive().setScrollFactor(0).setDepth(200);
        this.btnA = this.add.text(sw - 180, sh - 180, '⚔', { ...btnStyle, backgroundColor: '#f00000aa' }).setInteractive().setScrollFactor(0).setDepth(200);

        this.move = { L: false, R: false, J: false };
        this.btnL.on('pointerdown', () => this.move.L = true);
        this.btnL.on('pointerup', () => this.move.L = false);
        this.btnR.on('pointerdown', () => this.move.R = true);
        this.btnR.on('pointerup', () => this.move.R = false);
        this.btnJ.on('pointerdown', () => this.move.J = true);
        this.btnJ.on('pointerup', () => this.move.J = false);
        this.btnA.on('pointerdown', () => this.attack());
    }

    attack() {
        if (!this.isAttacking) {
            this.isAttacking = true;
            this.player.setTint(0xff0000);
            this.time.delayedCall(200, () => {
                this.player.clearTint();
                this.isAttacking = false;
            });
            
            // Boss'a yakınlık kontrolü
            if (Phaser.Math.Distance.Between(this.player.x, this.player.y, this.boss.x, this.boss.y) < 500) {
                this.bossHP -= 50;
                document.getElementById('boss-hp').innerText = this.bossHP;
            }
        }
    }

    update() {
        // Yönler
        if (this.keys.A.isDown || this.move.L) this.player.setVelocityX(-800);
        else if (this.keys.D.isDown || this.move.R) this.player.setVelocityX(800);
        else this.player.setVelocityX(0);

        // Zıplama (W tuşu veya Üst Ok)
        if ((this.keys.W.isDown || this.move.J) && this.player.body.touching.down) {
            this.player.setVelocityY(-1700);
        }

        // Space = Vurma
        if (Phaser.Input.Keyboard.JustDown(this.keys.SPACE)) {
            this.attack();
        }
    }
}

const config = {
    type: Phaser.AUTO,
    width: window.innerWidth,
    height: window.innerHeight,
    physics: { default: 'arcade', arcade: { gravity: { y: 4000 } } },
    scene: [MyKnightLegacy]
};
new Phaser.Game(config);
</script>
</body>
</html>
