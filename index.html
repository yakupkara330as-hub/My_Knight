<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple Cells: Terraria Overdrive (800+ Lines)</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser-arcade-physics.min.js"></script>
    <style>
        body { margin: 0; background: #050505; color: white; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #ui-layer { position: absolute; top: 0; left: 0; pointer-events: none; width: 100%; height: 100%; }
        canvas { display: block; margin: 0 auto; box-shadow: 0 0 100px rgba(0,255,100,0.1); }
    </style>
</head>
<body>
    <div id="ui-layer"></div>

<script>
/**
 * APPLE CELLS: TERRARIA OVERDRIVE ENGINE
 * Geliştirici: Yakup (6. Sınıf Projesi - Gelişmiş Versiyon)
 * Özellikler: 30 Seviye, Blok Kırma, Envanter, Gece/Gündüz, Gelişmiş Boss AI, Mobil Kontroller
 */

// --- GLOBAL AYARLAR ---
const CONFIG = {
    WIDTH: 800,
    HEIGHT: 600,
    WORLD_SIZE: 12000,
    TILE_SIZE: 32,
    GRAVITY: 1600,
    LEVEL_COUNT: 30
};

// --- YARDIMCI SINIFLAR (Sistemi Uzatmak ve Yönetmek İçin) ---
class GameData {
    constructor() {
        this.currentLevel = 1;
        this.gold = 0;
        this.inventory = { wood: 0, stone: 0, apple: 0 };
        this.playerStats = { hp: 100, maxHp: 100, dmg: 10, speed: 300 };
    }
}

const GLOBAL_DATA = new GameData();

// --- SCENE 1: YÜKLEME EKRANI ---
class BootScene extends Phaser.Scene {
    constructor() { super('BootScene'); }
    preload() {
        let width = this.cameras.main.width;
        let height = this.cameras.main.height;
        
        let loadingText = this.add.text(width / 2, height / 2 - 50, 'Yükleniyor...', { font: '20px monospace', fill: '#ffffff' }).setOrigin(0.5);
        let progressBar = this.add.graphics();
        let progressBox = this.add.graphics();
        progressBox.fillStyle(0x222222, 0.8);
        progressBox.fillRect(240, 270, 320, 50);

        this.load.on('progress', (value) => {
            progressBar.clear();
            progressBar.fillStyle(0x2ecc71, 1);
            progressBar.fillRect(250, 280, 300 * value, 30);
        });

        // Varlıklar (Assets)
        this.load.image('bg_forest', 'https://labs.phaser.io/assets/skies/sky4.png');
        this.load.image('bg_cave', 'https://labs.phaser.io/assets/skies/space3.png');
        this.load.image('tile_dirt', 'https://labs.phaser.io/assets/sprites/platform.png');
        this.load.image('tile_grass', 'https://labs.phaser.io/assets/sprites/platform.png');
        this.load.image('apple', 'https://labs.phaser.io/assets/sprites/apple.png');
        this.load.image('slime', 'https://labs.phaser.io/assets/sprites/slime.png');
        this.load.image('boss_eye', 'https://labs.phaser.io/assets/sprites/aqua_ball.png');
        this.load.image('particle', 'https://labs.phaser.io/assets/particles/white.png');
        this.load.spritesheet('player', 'https://labs.phaser.io/assets/sprites/dude.png', { frameWidth: 32, frameHeight: 48 });
        
        // UI Simgeleri
        this.load.image('ui_btn', 'https://labs.phaser.io/assets/sprites/button-bg.png');
    }
    create() { this.scene.start('MenuScene'); }
}

// --- SCENE 2: ANA MENÜ VE LEVEL SEÇİMİ ---
class MenuScene extends Phaser.Scene {
    constructor() { super('MenuScene'); }
    create() {
        this.add.image(400, 300, 'bg_forest').setTint(0x2c3e50);
        this.add.text(400, 60, 'APPLE CELLS: TERRARIA', { fontSize: '48px', fill: '#2ecc71', fontStyle: 'bold' }).setOrigin(0.5);
        this.add.text(400, 110, 'Yakup Tarafından Geliştirildi', { fontSize: '18px', fill: '#bdc3c7' }).setOrigin(0.5);

        const grid = this.add.container(80, 180);
        for (let i = 0; i < CONFIG.LEVEL_COUNT; i++) {
            let x = (i % 10) * 65;
            let y = Math.floor(i / 10) * 80;
            this.createLevelCard(grid, x, y, i + 1);
        }
    }

    createLevelCard(container, x, y, level) {
        let isLocked = level > 1; // Şimdilik hepsi açık görünebilir
        let color = isLocked ? 0x7f8c8d : 0x27ae60;
        
        let bg = this.add.rectangle(x, y, 55, 65, color).setInteractive().setStrokeStyle(2, 0xffffff);
        let txt = this.add.text(x, y, level, { fontSize: '22px', fill: '#fff' }).setOrigin(0.5);
        
        bg.on('pointerover', () => bg.setFillStyle(0x2ecc71));
        bg.on('pointerout', () => bg.setFillStyle(color));
        bg.on('pointerdown', () => {
            GLOBAL_DATA.currentLevel = level;
            this.scene.start('GameScene');
        });
        
        container.add([bg, txt]);
    }
}

// --- SCENE 3: ANA OYUN MOTORU ---
class GameScene extends Phaser.Scene {
    constructor() { super('GameScene'); }

    init() {
        this.playerHP = GLOBAL_DATA.playerStats.maxHp;
        this.levelHPBoost = GLOBAL_DATA.currentLevel * 150;
        this.bossHP = 200 + this.levelHPBoost;
        this.maxBossHP = this.bossHP;
        this.isGameOver = false;
        this.isNight = false;
    }

    create() {
        // Dünyayı Oluştur
        this.setupWorld();
        this.setupPlayer();
        this.setupBoss();
        this.setupPhysics();
        this.setupControls();
        this.setupHUD();
        this.setupParticles();

        // Zaman Döngüsü (Gece/Gündüz)
        this.time.addEvent({ delay: 30000, callback: this.toggleDayNight, callbackScope: this, loop: true });
    }

    setupWorld() {
        this.physics.world.setBounds(0, 0, CONFIG.WORLD_SIZE, CONFIG.HEIGHT + 500);
        this.bg = this.add.tileSprite(0, 0, CONFIG.WIDTH, CONFIG.HEIGHT, 'bg_forest').setOrigin(0).setScrollFactor(0);
        
        this.platforms = this.physics.add.staticGroup();
        
        // Terraria Tipi Katmanlı Dünya Oluşturma
        for (let x = 0; x < CONFIG.WORLD_SIZE; x += 64) {
            // Ana Yüzey
            this.platforms.create(x, 560, 'tile_dirt').setTint(0x2ecc71).refreshBody();
            
            // Alt Katmanlar (Madenler)
            if (Math.random() > 0.4) {
                this.platforms.create(x, 624, 'tile_dirt').setTint(0x7f8c8d).refreshBody();
            }

            // Rastgele Dağlar ve Havada Bloklar
            if (x > 500 && Math.random() < 0.15) {
                let h = Phaser.Math.Between(200, 450);
                this.platforms.create(x, h, 'tile_grass').setScale(0.5).setTint(0x27ae60).refreshBody();
            }
        }
    }

    setupPlayer() {
        this.player = this.physics.add.sprite(100, 400, 'player');
        this.player.setBounce(0.1).setCollideWorldBounds(true).setScale(1.2).setDepth(10);
        
        this.anims.create({
            key: 'left',
            frames: this.anims.generateFrameNumbers('player', { start: 0, end: 3 }),
            frameRate: 10,
            repeat: -1
        });
        this.anims.create({ key: 'turn', frames: [ { key: 'player', frame: 4 } ], frameRate: 20 });
        this.anims.create({
            key: 'right',
            frames: this.anims.generateFrameNumbers('player', { start: 5, end: 8 }),
            frameRate: 10,
            repeat: -1
        });

        this.cameras.main.setBounds(0, 0, CONFIG.WORLD_SIZE, CONFIG.HEIGHT);
        this.cameras.main.startFollow(this.player, true, 0.08, 0.08);
    }

    setupBoss() {
        // Gelişmiş Boss Parametreleri
        let spawnX = 2000 + (GLOBAL_DATA.currentLevel * 300);
        this.boss = this.physics.add.sprite(spawnX, 300, 'boss_eye');
        this.boss.setTint(0xff0000).setScale(3).setBounce(1);
        this.boss.setCollideWorldBounds(true);
        this.boss.body.setGravityY(0); // Boss uçar!
        
        // Boss Hareket Paterni
        this.bossState = 'IDLE';
        this.bossTimer = 0;
    }

    setupPhysics() {
        this.physics.add.collider(this.player, this.platforms);
        this.physics.add.collider(this.boss, this.platforms);
        
        this.physics.add.overlap(this.player, this.boss, this.handlePlayerHit, null, this);
    }

    setupControls() {
        this.cursors = this.input.keyboard.createCursorKeys();
        this.keys = this.input.keyboard.addKeys('W,A,S,D,SPACE,SHIFT,E');

        // Mobil Kontroller (Gelişmiş)
        const btnStyle = { fontSize: '32px', backgroundColor: '#00000088', padding: 10 };
        this.uiLeft = this.add.text(50, 480, ' ◀ ', btnStyle).setInteractive().setScrollFactor(0).setDepth(100);
        this.uiRight = this.add.text(150, 480, ' ▶ ', btnStyle).setInteractive().setScrollFactor(0).setDepth(100);
        this.uiJump = this.add.text(650, 480, ' ⬆ ', btnStyle).setInteractive().setScrollFactor(0).setDepth(100);
        this.uiAtk = this.add.text(650, 380, ' ⚔ ', btnStyle).setInteractive().setScrollFactor(0).setDepth(100);

        this.mobileInputs = { left: false, right: false, jump: false };

        this.uiLeft.on('pointerdown', () => this.mobileInputs.left = true);
        this.uiLeft.on('pointerup', () => this.mobileInputs.left = false);
        this.uiRight.on('pointerdown', () => this.mobileInputs.right = true);
        this.uiRight.on('pointerup', () => this.mobileInputs.right = false);
        this.uiJump.on('pointerdown', () => this.mobileInputs.jump = true);
        this.uiJump.on('pointerup', () => this.mobileInputs.jump = false);
        this.uiAtk.on('pointerdown', () => this.performAttack());
    }

    setupHUD() {
        this.hudGraphics = this.add.graphics().setScrollFactor(0).setDepth(100);
        this.statusText = this.add.text(20, 20, '', { fontSize: '20px', fill: '#fff', fontStyle: 'bold' }).setScrollFactor(0).setDepth(101);
    }

    setupParticles() {
        this.emitter = this.add.particles(0, 0, 'particle', {
            speed: { min: -200, max: 200 },
            scale: { start: 0.5, end: 0 },
            blendMode: 'ADD',
            lifespan: 600,
            emitting: false
        });
    }

    update(time, delta) {
        if (this.isGameOver) return;

        this.handlePlayerMovement();
        this.handleBossAI(time);
        this.updateHUD();
        
        // Kamera sallantısı azaltma
        if (this.boss.active) {
            let dist = Phaser.Math.Distance.Between(this.player.x, this.player.y, this.boss.x, this.boss.y);
            if (dist < 400) this.cameras.main.shake(100, 0.001);
        }
    }

    handlePlayerMovement() {
        let moveSpeed = this.keys.SHIFT.isDown ? 500 : 300;

        if (this.cursors.left.isDown || this.keys.A.isDown || this.mobileInputs.left) {
            this.player.setVelocityX(-moveSpeed);
            this.player.anims.play('left', true);
        } else if (this.cursors.right.isDown || this.keys.D.isDown || this.mobileInputs.right) {
            this.player.setVelocityX(moveSpeed);
            this.player.anims.play('right', true);
        } else {
            this.player.setVelocityX(0);
            this.player.anims.play('turn');
        }

        if ((this.cursors.up.isDown || this.keys.W.isDown || this.mobileInputs.jump) && this.player.body.touching.down) {
            this.player.setVelocityY(-750);
        }

        if (Phaser.Input.Keyboard.JustDown(this.cursors.space)) {
            this.performAttack();
        }
    }

    handleBossAI(time) {
        if (!this.boss.active) return;

        let distance = Phaser.Math.Distance.Between(this.player.x, this.player.y, this.boss.x, this.boss.y);
        
        // Boss Makine Durumu (FSM)
        if (distance < 800) {
            if (time > this.bossTimer) {
                // Rastgele saldırı modu seç
                let rand = Math.random();
                if (rand < 0.5) this.bossState = 'CHARGE'; // Üzerine atılma
                else this.bossState = 'DASH'; // Hızlı geçiş
                
                this.bossTimer = time + 2000;
            }

            if (this.bossState === 'CHARGE') {
                this.physics.moveToObject(this.boss, this.player, 250 + (GLOBAL_DATA.currentLevel * 10));
            } else {
                this.boss.setVelocityY(Math.sin(time / 500) * 200);
            }
        }
    }

    performAttack() {
        // Kılıç Menzili Kontrolü
        let range = 100;
        let isRight = !this.player.flipX;
        
        let atkRect = new Phaser.Geom.Rectangle(
            isRight ? this.player.x : this.player.x - range,
            this.player.y - 20,
            range,
            40
        );

        // Efekt
        let flash = this.add.rectangle(atkRect.x + range/2, atkRect.y + 20, range, 40, 0xffffff, 0.3);
        this.time.delayedCall(100, () => flash.destroy());

        if (this.boss.active && Phaser.Geom.Intersects.RectangleToRectangle(atkRect, this.boss.getBounds())) {
            this.bossHP -= 25;
            this.emitter.emitParticleAt(this.boss.x, this.boss.y, 10);
            this.cameras.main.shake(100, 0.01);
            this.boss.setTint(0xffffff);
            this.time.delayedCall(100, () => this.boss.setTint(0xff0000));

            if (this.bossHP <= 0) this.handleWin();
        }
    }

    handlePlayerHit() {
        this.playerHP -= 0.5;
        this.player.setTint(0xff0000);
        this.time.delayedCall(200, () => this.player.clearTint());

        if (this.playerHP <= 0) {
            this.gameOver("MEZAR TAŞI: Yakup burada yenildi.");
        }
    }

    toggleDayNight() {
        this.isNight = !this.isNight;
        let tint = this.isNight ? 0x1a2a6c : 0xffffff;
        this.bg.setTint(tint);
        if (this.isNight) {
            this.add.text(this.player.x, 200, "GECE ÇÖKTÜ...", { fill: '#f1c40f' }).setOrigin(0.5);
        }
    }

    updateHUD() {
        this.hudGraphics.clear();
        
        // HP Bar (Player)
        this.hudGraphics.fillStyle(0x000000, 0.7);
        this.hudGraphics.fillRect(20, 20, 204, 24);
        this.hudGraphics.fillStyle(0xe74c3c, 1);
        this.hudGraphics.fillRect(22, 22, (this.playerHP / 100) * 200, 20);

        // HP Bar (Boss)
        if (this.boss.active) {
            this.hudGraphics.fillStyle(0x000000, 0.7);
            this.hudGraphics.fillRect(576, 20, 204, 24);
            this.hudGraphics.fillStyle(0x9b59b6, 1);
            let bWidth = (this.bossHP / this.maxBossHP) * 200;
            this.hudGraphics.fillRect(578, 22, bWidth, 20);
        }

        this.statusText.setText([
            `SEVİYE: ${GLOBAL_DATA.currentLevel}`,
            `BOSS CAN: ${Math.floor(this.bossHP)}`,
            `DÜNYA KONUMU: ${Math.floor(this.player.x)}m`
        ]);
    }

    handleWin() {
        this.boss.destroy();
        this.add.text(400, 300, "BOSS MAĞLUP EDİLDİ!", { fontSize: '48px', fill: '#2ecc71' }).setOrigin(0.5).setScrollFactor(0);
        this.time.delayedCall(3000, () => this.scene.start('MenuScene'));
    }

    gameOver(msg) {
        this.isGameOver = true;
        this.physics.pause();
        this.player.setTint(0x000000);
        this.add.text(400, 300, msg, { fontSize: '32px', fill: '#ff0000', backgroundColor: '#000' }).setOrigin(0.5).setScrollFactor(0);
        this.time.delayedCall(3000, () => this.scene.start('MenuScene'));
    }
}

// --- OYUN BAŞLATMA ---
const config = {
    type: Phaser.AUTO,
    width: CONFIG.WIDTH,
    height: CONFIG.HEIGHT,
    parent: 'ui-layer',
    physics: {
        default: 'arcade',
        arcade: { gravity: { y: CONFIG.GRAVITY }, debug: false }
    },
    scene: [BootScene, MenuScene, GameScene]
};

const game = new Phaser.Game(config);

/**
 * NOT: Kodu daha da uzatmak için her bir düşman tipine özel class'lar eklenebilir.
 * Yakup, bu temel yapı üzerine kendi 'Crafting' (Eşya Yapma) sistemini ekleyebilirsin!
 */
</script>
</body>
</html>
