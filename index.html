<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Knight: The Real 400+ Build | Yakup Kara</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser-arcade-physics.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #000; overflow: hidden; touch-action: none; }
        #game-ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1000; }
        .stats-panel { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.85); color: #00ff00; padding: 20px; border: 3px solid #00ff00; font-family: 'Courier New', monospace; border-radius: 10px; pointer-events: auto; }
        .boss-bar-bg { position: absolute; top: 20px; right: 20px; width: 300px; height: 30px; background: #440000; border: 2px solid #fff; }
        #boss-bar-fill { width: 100%; height: 100%; background: #ff0000; transition: width 0.2s; }
    </style>
</head>
<body>
    <div id="game-ui">
        <div class="stats-panel">
            <div>OYUNCU: YAKUP</div>
            <div>SİSTEM: AKTİF</div>
            <div>MESAFE: <span id="dist-val">0</span>m</div>
        </div>
        <div class="boss-bar-bg"><div id="boss-bar-fill"></div></div>
    </div>

<script>
/**
 * MY KNIGHT - FULL SCALE DEVELOPMENT
 * AUTHOR: Yakup Kara
 * ARCHITECTURE: Hardware-Level Optimization (M-Series Ready)
 */

class MyKnightGame extends Phaser.Scene {
    constructor() {
        super('MyKnightGame');
        this.bossHP = 1000;
        this.maxBossHP = 1000;
        this.playerSpeed = 750;
        this.jumpPower = -1700;
        this.isGameOver = false;
        this.attackCooldown = false;
    }

    preload() {
        this.load.image('sky', 'https://labs.phaser.io/assets/skies/gradient24.png');
        this.load.image('platform_long', 'https://labs.phaser.io/assets/sprites/platform.png');
        this.load.image('boss_entity', 'https://labs.phaser.io/assets/sprites/aqua_ball.png');
        this.load.spritesheet('knight_sheet', 'https://labs.phaser.io/assets/sprites/dude.png', { frameWidth: 32, frameHeight: 48 });
    }

    create() {
        // WORLD CONFIGURATION
        this.physics.world.setBounds(0, 0, 20000, 2000);
        this.add.tileSprite(0, 0, 20000, 2000, 'sky').setOrigin(0);

        // STATIC GROUPS (LEVEL DESIGN)
        this.platforms = this.physics.add.staticGroup();
        
        // Main Ground Layer
        for (let i = 0; i < 20000; i += 400) {
            let g = this.platforms.create(i, 1960, 'platform_long').setScale(2).refreshBody();
            g.setTint(0x1a1a1a);
        }

        // Detailed Level Structures (Yakup'un Orijinal Planı)
        this.setupLevelPlatforms();

        // PLAYER INITIALIZATION
        this.player = this.physics.add.sprite(300, 1800, 'knight_sheet').setScale(2.8).setDepth(100);
        this.player.setCollideWorldBounds(true);
        this.player.body.setGravityY(4000);

        // BOSS INITIALIZATION
        this.boss = this.physics.add.sprite(19000, 1750, 'boss_entity').setScale(18).setTint(0xff0000);
        this.boss.setImmovable(true);

        // PHYSICS & COLLISIONS
        this.physics.add.collider(this.player, this.platforms);
        this.physics.add.overlap(this.player, this.boss, this.handleBossFight, null, this);

        // CAMERA SYSTEM
        this.cameras.main.startFollow(this.player, true, 0.1, 0.1);
        this.cameras.main.setBounds(0, 0, 20000, 2000);

        // INPUT SYSTEMS
        this.cursors = this.input.keyboard.createCursorKeys();
        this.wasd = this.input.keyboard.addKeys('W,A,S,D,SPACE');
        
        this.createAnimations();
        this.initMobileControls();

        // HUD Elements
        this.distText = document.getElementById('dist-val');
        this.bossFill = document.getElementById('boss-bar-fill');
    }

    setupLevelPlatforms() {
        // Platformların ulaşılabilirliği Yakup'un zıplama gücüne göre kalibre edildi
        const coords = [
            [800, 1700], [1300, 1500], [1900, 1400], [2500, 1600], [3100, 1450],
            [3800, 1300], [4500, 1500], [5200, 1700], [6000, 1400], [6800, 1200],
            [7500, 1500], [8300, 1300], [9000, 1600], [10000, 1400], [11500, 1500]
        ];
        coords.forEach(c => this.platforms.create(c[0], c[1], 'platform_long').refreshBody());
    }

    createAnimations() {
        this.anims.create({ key: 'walk_left', frames: this.anims.generateFrameNumbers('knight_sheet', { start: 0, end: 3 }), frameRate: 12, repeat: -1 });
        this.anims.create({ key: 'idle', frames: [ { key: 'knight_sheet', frame: 4 } ], frameRate: 20 });
        this.anims.create({ key: 'walk_right', frames: this.anims.generateFrameNumbers('knight_sheet', { start: 5, end: 8 }), frameRate: 12, repeat: -1 });
    }

    initMobileControls() {
        const sw = window.innerWidth;
        const sh = window.innerHeight;
        const btnOpt = { fontSize: '85px', backgroundColor: '#000000bb', padding: 30, borderRadius: '20px' };

        // Left Controls
        this.leftBtn = this.add.text(60, sh - 220, '◀', btnOpt).setInteractive().setScrollFactor(0).setDepth(2000);
        this.rightBtn = this.add.text(340, sh - 220, '▶', btnOpt).setInteractive().setScrollFactor(0).setDepth(2000);

        // Right Controls
        this.jumpBtn = this.add.text(sw - 500, sh - 220, '▲', btnOpt).setInteractive().setScrollFactor(0).setDepth(2000);
        this.atkBtn = this.add.text(sw - 240, sh - 220, '⚔', { ...btnOpt, backgroundColor: '#880000bb' }).setInteractive().setScrollFactor(0).setDepth(2000);

        this.mMove = { L: false, R: false, J: false };

        this.leftBtn.on('pointerdown', () => this.mMove.L = true);
        this.leftBtn.on('pointerup', () => this.mMove.L = false);
        this.rightBtn.on('pointerdown', () => this.mMove.R = true);
        this.rightBtn.on('pointerup', () => this.mMove.R = false);
        this.jumpBtn.on('pointerdown', () => this.mMove.J = true);
        this.jumpBtn.on('pointerup', () => this.mMove.J = false);
        this.atkBtn.on('pointerdown', () => this.performAttack());
    }

    performAttack() {
        if (!this.attackCooldown) {
            this.attackCooldown = true;
            this.player.setTint(0xff0000);
            this.cameras.main.shake(100, 0.01);
            
            // Check Hit Distance
            if (Phaser.Math.Distance.Between(this.player.x, this.player.y, this.boss.x, this.boss.y) < 700) {
                this.bossHP -= 50;
                let percent = (this.bossHP / this.maxBossHP) * 100;
                this.bossFill.style.width = Math.max(0, percent) + '%';
            }

            this.time.delayedCall(200, () => {
                this.player.clearTint();
                this.attackCooldown = false;
            });
        }
    }

    update() {
        if (this.isGameOver) return;

        // HORIZONTAL MOVEMENT
        if (this.wasd.A.isDown || this.mMove.L) {
            this.player.setVelocityX(-this.playerSpeed);
            this.player.anims.play('walk_left', true);
        } else if (this.wasd.D.isDown || this.mMove.R) {
            this.player.setVelocityX(this.playerSpeed);
            this.player.anims.play('walk_right', true);
        } else {
            this.player.setVelocityX(0);
            this.player.anims.play('idle');
        }

        // VERTICAL MOVEMENT (W = Jump, Space = Attack)
        if ((this.wasd.W.isDown || this.mMove.J) && this.player.body.touching.down) {
            this.player.setVelocityY(this.jumpPower);
        }

        if (Phaser.Input.Keyboard.JustDown(this.wasd.SPACE)) {
            this.performAttack();
        }

        // HUD UPDATE
        this.distText.innerText = Math.floor(this.player.x);
    }

    handleBossFight() {
        if (this.bossHP <= 0) {
            this.boss.destroy();
            this.isGameOver = true;
            alert("TEBRİKLER YAKUP! BOSS YENİLDİ.");
        }
    }
}

const config = {
    type: Phaser.AUTO,
    width: window.innerWidth,
    height: window.innerHeight,
    physics: { default: 'arcade', arcade: { gravity: { y: 4000 }, debug: false } },
    scene: [MyKnightGame]
};
const game = new Phaser.Game(config);
</script>
</body>
</html>
