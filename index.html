<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Apple Cells: Ultimate Terraria Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser-arcade-physics.min.js"></script>
    <style>
        body { margin: 0; background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: 'Courier New', Courier, monospace; }
        canvas { box-shadow: 0 0 50px rgba(46, 204, 113, 0.3); border: 4px solid #2d3436; }
    </style>
</head>
<body>

<script>
/**
 * YAKUP KARA - APPLE CELLS ULTIMATE ENGINE
 * Özellikler: Seviye Sistemi, Akıllı Boss AI, Parçacık Efektleri, Envanter Temeli, Dash & Combat
 */

class BootScene extends Phaser.Scene {
    constructor() { super('BootScene'); }
    preload() {
        // Yükleme ekranı
        let loadingBar = this.add.graphics({ fillStyle: { color: 0x2ecc71 } });
        this.load.on('progress', (percent) => {
            loadingBar.clear();
            loadingBar.fillRect(200, 215, 400 * percent, 20);
        });

        // ASSET YÜKLEME
        this.load.image('sky', 'https://labs.phaser.io/assets/skies/sky1.png');
        this.load.image('dirt', 'https://labs.phaser.io/assets/sprites/platform.png');
        this.load.image('apple', 'https://labs.phaser.io/assets/sprites/apple.png');
        this.load.image('slime', 'https://labs.phaser.io/assets/sprites/slime.png');
        this.load.image('particle', 'https://labs.phaser.io/assets/particles/white.png');
        this.load.image('gate', 'https://labs.phaser.io/assets/sprites/longarrow.png');
        this.load.spritesheet('hero', 'https://labs.phaser.io/assets/sprites/dude.png', { frameWidth: 32, frameHeight: 48 });
    }
    create() { this.scene.start('MainMenu'); }
}

class MainMenu extends Phaser.Scene {
    constructor() { super('MainMenu'); }
    create() {
        this.add.rectangle(400, 225, 800, 450, 0x1a1a1a);
        this.add.text(400, 80, 'APPLE CELLS', { fontSize: '60px', fill: '#2ecc71', fontStyle: 'bold' }).setOrigin(0.5);
        this.add.text(400, 140, 'TERRARIA SOULS', { fontSize: '25px', fill: '#bdc3c7' }).setOrigin(0.5);

        // Seviye Butonları
        for (let i = 1; i <= 10; i++) {
            let x = 160 + ((i - 1) % 5) * 120;
            let y = 250 + (Math.floor((i - 1) / 5)) * 100;
            this.createLevelButton(x, y, i);
        }
    }

    createLevelButton(x, y, level) {
        let btn = this.add.rectangle(x, y, 90, 70, 0x27ae60).setInteractive().setStrokeStyle(4, 0x2ecc71);
        this.add.text(x, y, level, { fontSize: '32px', fill: '#fff', fontStyle: 'bold' }).setOrigin(0.5);
        
        btn.on('pointerover', () => btn.setFillStyle(0x2ecc71));
        btn.on('pointerout', () => btn.setFillStyle(0x27ae60));
        btn.on('pointerdown', () => this.scene.start('GameScene', { level: level }));
    }
}

class GameScene extends Phaser.Scene {
    constructor() { super('GameScene'); }

    init(data) {
        this.level = data.level;
        this.playerHP = 100;
        this.maxPlayerHP = 100;
        this.bossHP = 100 + (this.level * 75);
        this.maxBossHP = this.bossHP;
        this.gold = 0;
        this.isAttacking = false;
        this.canDash = true;
        this.isGameOver = false;
    }

    create() {
        // Dünya ve Fizik Sınırları
        const worldWidth = 6000;
        this.physics.world.setBounds(0, 0, worldWidth, 600);
        
        // Arka Plan (Parallax temeli)
        this.add.image(0, 0, 'sky').setOrigin(0).setScale(6).setScrollFactor(0.2).setTint(0x2c3e50);

        // Harita Oluşturma (Terraria Tarzı Rastgelelik)
        this.platforms = this.physics.add.staticGroup();
        this.createWorld(worldWidth);

        // Oyuncu Kurulumu
        this.player = this.physics.add.sprite(200, 400, 'hero');
        this.player.setCollideWorldBounds(true).setDepth(5).setScale(1.2);
        this.player.setTint(0x3498db);

        // Kamera
        this.cameras.main.setBounds(0, 0, worldWidth, 600);
        this.cameras.main.startFollow(this.player, true, 0.1, 0.1);

        // Boss (Hareketli ve Zıplayan AI)
        this.boss = this.physics.add.sprite(2000 + (this.level * 200), 400, 'slime');
        this.boss.setTint(0x9b59b6).setScale(2 + (this.level * 0.2)).setBounce(0.3).setCollideWorldBounds(true);
        this.boss.body.setGravityY(1000);

        // Gruplar
        this.apples = this.physics.add.group();
        this.spawnCollectibles(worldWidth);

        // Efektler
        this.swordHitbox = this.add.rectangle(0, 0, 100, 40, 0xffffff, 0).setOrigin(0.5);
        this.physics.add.existing(this.swordHitbox, true);
        
        this.particles = this.add.particles(0, 0, 'particle', {
            speed: { min: -100, max: 100 },
            scale: { start: 0.2, end: 0 },
            lifespan: 500,
            emitting: false
        });

        // Çarpışmalar
        this.setupCollisions();

        // Kontroller
        this.setupInputs();

        // Arayüz
        this.createHUD();
    }

    createWorld(width) {
        for (let i = 0; i < width / 128; i++) {
            // Ana zemin
            this.platforms.create(i * 128, 580, 'dirt').setTint(0x4d3227).refreshBody();
            
            // Rastgele havada uçan Terraria adacıkları
            if (i > 2 && Math.random() < 0.3) {
                let y = Phaser.Math.Between(250, 450);
                this.platforms.create(i * 128, y, 'dirt').setScale(0.5).setTint(0x27ae60).refreshBody();
            }
        }
    }

    spawnCollectibles(width) {
        for (let i = 0; i < 30; i++) {
            let x = Phaser.Math.Between(500, width - 500);
            let y = Phaser.Math.Between(100, 400);
            this.apples.create(x, y, 'apple').setBounceY(0.4);
        }
    }

    setupInputs() {
        this.cursors = this.input.keyboard.createCursorKeys();
        this.keys = this.input.keyboard.addKeys({
            attack: 'SPACE',
            dash: 'SHIFT',
            restart: 'R'
        });
    }

    setupCollisions() {
        this.physics.add.collider(this.player, this.platforms);
        this.physics.add.collider(this.boss, this.platforms);
        this.physics.add.collider(this.apples, this.platforms);
        
        this.physics.add.overlap(this.player, this.apples, (p, a) => {
            a.destroy();
            this.gold += 10;
            this.particles.emitParticleAt(a.x, a.y, 5);
        }, null, this);

        this.physics.add.overlap(this.player, this.boss, this.handlePlayerDamage, null, this);
    }

    createHUD() {
        this.hudGraphics = this.add.graphics().setScrollFactor(0).setDepth(10);
        this.goldText = this.add.text(20, 60, 'ALTIN: 0', { fontSize: '20px', fill: '#f1c40f' }).setScrollFactor(0).setDepth(11);
        this.levelText = this.add.text(20, 90, 'LEVEL: ' + this.level, { fontSize: '20px', fill: '#fff' }).setScrollFactor(0).setDepth(11);
    }

    update(time, delta) {
        if (this.isGameOver) return;

        this.handlePlayerMovement();
        this.handleBossAI();
        this.updateHUD();

        if (Phaser.Input.Keyboard.JustDown(this.keys.attack)) {
            this.executeAttack();
        }
    }

    handlePlayerMovement() {
        let currentSpeed = this.keys.dash.isDown ? 600 : 320;

        if (this.cursors.left.isDown) {
            this.player.setVelocityX(-currentSpeed);
            this.player.flipX = true;
        } else if (this.cursors.right.isDown) {
            this.player.setVelocityX(currentSpeed);
            this.player.flipX = false;
        } else {
            this.player.setVelocityX(0);
        }

        if (this.cursors.up.isDown && this.player.body.touching.down) {
            this.player.setVelocityY(-700);
        }
    }

    handleBossAI() {
        if (!this.boss.active) return;

        let distance = this.player.x - this.boss.x;

        // Boss Takip Sistemi
        if (Math.abs(distance) < 1000) {
            let bossSpeed = 150 + (this.level * 15);
            this.boss.setVelocityX(distance > 0 ? bossSpeed : -bossSpeed);
            
            // Terraria tarzı zıplama engeli aşma
            if (this.boss.body.blocked.left || this.boss.body.blocked.right) {
                this.boss.setVelocityY(-500);
            }
        }
    }

    executeAttack() {
        if (this.isAttacking) return;

        this.isAttacking = true;
        let attackSide = this.player.flipX ? -60 : 60;
        this.swordHitbox.setPosition(this.player.x + attackSide, this.player.y);
        
        // Görsel efekt (Kılıç İzi)
        let swing = this.add.rectangle(this.player.x + attackSide, this.player.y, 80, 10, 0x00ffff, 0.8);
        
        // Hasar Kontrolü
        if (this.boss.active && Phaser.Geom.Intersects.RectangleToRectangle(this.swordHitbox.getBounds(), this.boss.getBounds())) {
            this.bossHP -= 20;
            this.boss.setTint(0xffffff);
            this.particles.emitParticleAt(this.boss.x, this.boss.y, 10);
            this.time.delayedCall(100, () => this.boss.setTint(0x9b59b6));
            
            if (this.bossHP <= 0) {
                this.handleBossDeath();
            }
        }

        this.time.delayedCall(200, () => {
            swing.destroy();
            this.isAttacking = false;
        });
    }

    handlePlayerDamage() {
        if (this.isAttacking) return;
        
        this.playerHP -= 0.5;
        this.player.setTint(0xff0000);
        this.cameras.main.shake(100, 0.005);
        
        this.time.delayedCall(100, () => this.player.setTint(0x3498db));

        if (this.playerHP <= 0) {
            this.gameOver("YENİLDİN! Terraria dünyası seni yuttu.");
        }
    }

    handleBossDeath() {
        this.boss.destroy();
        this.gold += 500;
        let exit = this.physics.add.sprite(this.player.x + 300, 400, 'gate').setTint(0x2ecc71);
        this.physics.add.collider(exit, this.platforms);
        this.physics.add.overlap(this.player, exit, () => {
            alert("TEBRİKLER! Seviye " + this.level + " tamamlandı!");
            this.scene.start('MainMenu');
        }, null, this);
    }

    updateHUD() {
        this.hudGraphics.clear();
        
        // Oyuncu HP Bar
        this.hudGraphics.fillStyle(0x000000, 0.7);
        this.hudGraphics.fillRect(20, 20, 204, 24);
        this.hudGraphics.fillStyle(0xe74c3c, 1);
        this.hudGraphics.fillRect(22, 22, this.playerHP * 2, 20);

        // Boss HP Bar
        if (this.boss.active) {
            this.hudGraphics.fillStyle(0x000000, 0.7);
            this.hudGraphics.fillRect(576, 20, 204, 24);
            this.hudGraphics.fillStyle(0x9b59b6, 1);
            let bossBarWidth = (this.bossHP / this.maxBossHP) * 200;
            this.hudGraphics.fillRect(578, 22, bossBarWidth, 20);
        }

        this.goldText.setText('PARA: ' + this.gold);
    }

    gameOver(msg) {
        this.isGameOver = true;
        this.physics.pause();
        this.add.text(400, 225, msg, { fontSize: '32px', fill: '#fff', backgroundColor: '#000' }).setOrigin(0.5).setScrollFactor(0);
        this.time.delayedCall(2000, () => this.scene.start('MainMenu'));
    }
}

const config = {
    type: Phaser.AUTO,
    width: 800,
    height: 450,
    physics: {
        default: 'arcade',
        arcade: { gravity: { y: 1500 }, debug: false }
    },
    scene: [BootScene, MainMenu, GameScene]
};

const game = new Phaser.Game(config);
</script>
</body>
</html>
